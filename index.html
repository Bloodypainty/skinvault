<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FN Vault – Ma Collection</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#07070a; --bg2:#0d0d12; --bg3:#121218; --bg4:#181820; --bg5:#1e1e28;
  --border:rgba(255,255,255,0.06); --border2:rgba(255,255,255,0.12);
  --text:#eeeef2; --text-muted:#5a5a68; --text-dim:#9090a0;
  --fn:#00d4ff;
  --mythic:#ffd700; --legendary:#ff8c00; --epic:#9b30ff; --rare:#1e90ff; --uncommon:#00c060; --common:#777788;
  --festival:#ff6b35;
  --r:8px; --rl:14px; --rx:20px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Exo 2',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 70% 40% at 15% 0%,rgba(0,212,255,0.06),transparent 60%),radial-gradient(ellipse 60% 40% at 90% 100%,rgba(155,48,255,0.05),transparent 60%);pointer-events:none;z-index:0}
#app{display:flex;min-height:100vh;position:relative;z-index:1}

/* SIDEBAR */
#sidebar{width:225px;min-height:100vh;background:linear-gradient(180deg,var(--bg2),var(--bg));border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;z-index:100}
.sidebar-logo{padding:26px 22px 20px;border-bottom:1px solid var(--border)}
.sidebar-logo h1{font-family:'Rajdhani',sans-serif;font-size:1.45rem;font-weight:700;letter-spacing:.14em;background:linear-gradient(135deg,#fff,#4fc9e0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sidebar-logo span{font-size:.58rem;letter-spacing:.24em;color:var(--text-muted);text-transform:uppercase}
.sidebar-section{padding:16px 18px 5px;font-size:.58rem;letter-spacing:.22em;text-transform:uppercase;color:var(--text-muted);font-weight:600}
.sidebar-nav{padding:0 10px}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:var(--r);cursor:pointer;font-family:'Rajdhani',sans-serif;font-size:.94rem;font-weight:500;letter-spacing:.05em;color:var(--text-dim);transition:.22s;margin-bottom:2px;border:1px solid transparent;user-select:none}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;transition:.22s;background:#444450}
.nav-item[data-page=collection] .nav-dot{background:var(--fn)}
.nav-item[data-page=random] .nav-dot{background:linear-gradient(135deg,var(--fn),var(--epic))}
.nav-item.active{color:var(--text);background:var(--bg3)}
.nav-item.active[data-page=collection]{border-color:rgba(0,212,255,.25);background:linear-gradient(90deg,rgba(0,212,255,.08),transparent)}
.nav-item.active[data-page=random]{border-color:rgba(155,48,255,.25);background:linear-gradient(90deg,rgba(155,48,255,.08),transparent)}
.nav-item.active[data-page=collection] .nav-dot{box-shadow:0 0 10px var(--fn)}
.sidebar-bottom{margin-top:auto;padding:14px 10px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px}

/* MAIN */
#main{margin-left:225px;flex:1;padding:34px 38px;min-height:100vh}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px;padding-bottom:18px;border-bottom:1px solid var(--border);position:relative;flex-wrap:wrap;gap:12px}
.page-header::after{content:'';position:absolute;bottom:-1px;left:0;width:110px;height:1px}
.page-header.fn-page::after{background:linear-gradient(90deg,var(--fn),transparent)}
.page-title{font-family:'Rajdhani',sans-serif;font-size:2.1rem;font-weight:700;letter-spacing:.1em;line-height:1}
.fn-accent{color:var(--fn);text-shadow:0 0 40px rgba(0,212,255,.45)}
.count-badge{font-size:.72rem;padding:5px 12px;border-radius:20px;background:var(--bg3);border:1px solid var(--border2);color:var(--text-dim);font-family:'Rajdhani',sans-serif;letter-spacing:.1em}

/* GRID & CARDS */
.skins-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.skin-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;cursor:pointer;transition:transform .25s,box-shadow .25s,border-color .25s;position:relative}
.skin-card:hover{transform:translateY(-5px);box-shadow:0 12px 34px rgba(0,0,0,.4)}
.skin-card[data-rarity=Mythic]{border-color:rgba(255,215,0,.25)}
.skin-card[data-rarity=Legendary]{border-color:rgba(255,140,0,.22)}
.skin-card[data-rarity=Epic]{border-color:rgba(155,48,255,.25)}
.skin-card[data-rarity=Rare]{border-color:rgba(30,144,255,.22)}
.skin-card[data-rarity=Uncommon]{border-color:rgba(0,192,96,.22)}
.skin-card[data-rarity=Mythic]:hover{box-shadow:0 12px 40px rgba(255,215,0,.22),0 0 0 1px rgba(255,215,0,.4)}
.skin-card[data-rarity=Legendary]:hover{box-shadow:0 12px 40px rgba(255,140,0,.22),0 0 0 1px rgba(255,140,0,.4)}
.skin-card[data-rarity=Epic]:hover{box-shadow:0 12px 40px rgba(155,48,255,.22),0 0 0 1px rgba(155,48,255,.4)}
.skin-card[data-rarity=Rare]:hover{box-shadow:0 12px 40px rgba(30,144,255,.22),0 0 0 1px rgba(30,144,255,.4)}
.skin-card[data-rarity=Uncommon]:hover{box-shadow:0 12px 40px rgba(0,192,96,.22),0 0 0 1px rgba(0,192,96,.4)}
.skin-img-wrap{aspect-ratio:3/4;overflow:hidden;background:linear-gradient(135deg,var(--bg3),var(--bg4));position:relative}
.skin-img-wrap img{width:100%;height:100%;object-fit:cover;transition:transform .5s;display:block}
.skin-card:hover .skin-img-wrap img{transform:scale(1.07)}
.skin-img-wrap .no-img{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:2.3rem;color:var(--bg5)}
.skin-img-wrap::after{content:'';position:absolute;bottom:0;left:0;right:0;height:45%;background:linear-gradient(0deg,rgba(7,7,10,.85),transparent);pointer-events:none}
.rarity-bar{height:2px;width:100%}
.rarity-bar.Mythic{background:linear-gradient(90deg,var(--mythic),rgba(255,215,0,.2))}
.rarity-bar.Legendary{background:linear-gradient(90deg,var(--legendary),rgba(255,140,0,.2))}
.rarity-bar.Epic{background:linear-gradient(90deg,var(--epic),rgba(155,48,255,.2))}
.rarity-bar.Rare{background:linear-gradient(90deg,var(--rare),rgba(30,144,255,.2))}
.rarity-bar.Uncommon{background:linear-gradient(90deg,var(--uncommon),rgba(0,192,96,.2))}
.rarity-bar.Common{background:var(--common);opacity:.4}
.skin-info{padding:9px 11px 11px}
.skin-name{font-family:'Rajdhani',sans-serif;font-weight:600;font-size:.9rem;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.skin-meta{display:flex;align-items:center;justify-content:space-between;margin-top:4px;gap:5px}
.skin-rarity-label{font-size:.63rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.skin-rarity-label.Mythic{color:var(--mythic)}.skin-rarity-label.Legendary{color:var(--legendary)}.skin-rarity-label.Epic{color:var(--epic)}.skin-rarity-label.Rare{color:var(--rare)}.skin-rarity-label.Uncommon{color:var(--uncommon)}.skin-rarity-label.Common{color:var(--common)}
.skin-series-badge{font-size:.58rem;padding:2px 6px;border-radius:4px;background:rgba(255,255,255,.05);color:var(--text-muted);border:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80px}
.skin-weight-tag{font-size:.6rem;color:var(--epic);margin-top:3px;font-weight:600}
.skin-note{font-size:.68rem;color:var(--text-muted);margin-top:4px;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.festival-tag{font-size:.6rem;color:var(--festival);margin-top:2px;font-weight:600}
.card-actions{position:absolute;top:8px;right:8px;display:flex;gap:4px;opacity:0;transition:.2s;z-index:10}
.skin-card:hover .card-actions{opacity:1}
.skin-card.selectable .card-actions{display:none!important}
.card-btn{width:29px;height:29px;border-radius:7px;border:1px solid rgba(255,255,255,.1);cursor:pointer;font-size:.72rem;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(12px);transition:.2s}
.card-btn-edit{background:rgba(255,255,255,.12);color:#fff}
.card-btn-delete{background:rgba(220,50,50,.4);color:#ffb0b0}
.card-btn:hover{transform:scale(1.12)}

/* TABS */
.tabs{display:flex;gap:3px;margin-bottom:22px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:4px;width:fit-content;flex-wrap:wrap}
.tab{padding:8px 18px;border-radius:calc(var(--r) - 2px);cursor:pointer;font-family:'Rajdhani',sans-serif;font-weight:600;letter-spacing:.05em;font-size:.86rem;color:var(--text-muted);transition:.2s;border:none;background:none;white-space:nowrap}
.tab.active{background:var(--bg5);color:var(--text);box-shadow:0 1px 8px rgba(0,0,0,.3)}
.tab:hover:not(.active){color:var(--text-dim)}

/* SEARCH & FILTER */
.search-bar{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.search-input-wrap{position:relative;flex:1;max-width:340px}
.search-input-wrap input{padding-left:36px}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:.9rem;pointer-events:none}
.filter-bar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:20px}
.filter-btn{padding:5px 13px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text-muted);font-size:.72rem;cursor:pointer;transition:.22s;font-family:'Exo 2',sans-serif}
.filter-btn:hover{background:var(--bg3);color:var(--text-dim);border-color:var(--border2)}
.filter-btn.active{background:var(--bg4);color:var(--text);border-color:var(--border2)}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.86);backdrop-filter:blur(10px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .25s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--rx);width:100%;max-width:600px;max-height:92vh;overflow-y:auto;transform:scale(.93) translateY(20px);transition:transform .25s;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal-overlay.open .modal{transform:scale(1) translateY(0)}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:20px 26px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg2);z-index:2}
.modal-title{font-family:'Rajdhani',sans-serif;font-size:1.35rem;font-weight:700;letter-spacing:.06em}
.modal-close{width:32px;height:32px;border-radius:8px;border:1px solid var(--border2);background:var(--bg3);color:var(--text-dim);cursor:pointer;font-size:1.05rem;transition:.2s;display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:var(--bg5);color:var(--text)}
.modal-body{padding:22px}

/* FORMS */
.form-section{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);padding:24px 26px;margin-bottom:18px}
.form-section-title{font-family:'Rajdhani',sans-serif;font-size:1.02rem;font-weight:700;letter-spacing:.06em;margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.form-row.single{grid-template-columns:1fr}
.form-group{display:flex;flex-direction:column;gap:6px}
label{font-size:.66rem;letter-spacing:.13em;text-transform:uppercase;color:var(--text-muted);font-weight:600}
input[type=text],input[type=url],select{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r);padding:10px 13px;color:var(--text);font-family:'Exo 2',sans-serif;font-size:.9rem;outline:none;transition:.2s;width:100%}
textarea{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r);padding:10px 13px;color:var(--text);font-family:'Exo 2',sans-serif;font-size:.9rem;outline:none;transition:.2s;width:100%;resize:vertical;min-height:60px}
textarea:focus{border-color:rgba(255,255,255,.3);box-shadow:0 0 0 3px rgba(255,255,255,.04)}
input:focus,select:focus{border-color:rgba(255,255,255,.3);box-shadow:0 0 0 3px rgba(255,255,255,.04)}
select option{background:var(--bg3)}
.img-url-wrap{display:flex;flex-direction:column;gap:8px}
.img-url-preview{width:100%;height:130px;object-fit:contain;border-radius:var(--r);background:var(--bg3);border:1px solid var(--border);display:none}
.img-url-preview.show{display:block}

/* WEIGHT WIDGET */
.weight-wrap{display:flex;align-items:center;gap:8px;margin-top:6px}
.weight-label{font-size:.6rem;text-transform:uppercase;letter-spacing:.1em;color:var(--text-muted);font-weight:600;white-space:nowrap}
.weight-slider{flex:1;height:4px;accent-color:var(--epic);cursor:pointer}
.weight-value{font-size:.8rem;font-family:'Rajdhani',sans-serif;font-weight:700;color:var(--epic);min-width:20px;text-align:center}
.weight-bar-row{display:flex;gap:3px;align-items:center;margin-top:2px}
.weight-pip{width:8px;height:8px;border-radius:2px;background:var(--bg4);border:1px solid var(--border);transition:.15s;flex-shrink:0}
.weight-pip.on{background:var(--epic);border-color:var(--epic)}

/* FESTIVAL TOGGLE */
.festival-toggle{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:.85rem;color:var(--text-dim);font-weight:400;text-transform:none;letter-spacing:0}
.festival-toggle input{width:15px;height:15px;cursor:pointer;accent-color:var(--festival)}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 22px;border-radius:var(--r);border:none;cursor:pointer;font-family:'Rajdhani',sans-serif;font-weight:600;font-size:.92rem;letter-spacing:.06em;transition:.2s;white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.18);color:#fff}
.btn-primary:hover{background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.1));box-shadow:0 4px 16px rgba(0,0,0,.3)}
.btn-danger{background:rgba(220,50,50,.2);border:1px solid rgba(220,50,50,.4);color:#ff8a8a}
.btn-danger:hover{background:rgba(220,50,50,.32)}
.btn-sm{padding:7px 14px;font-size:.8rem}
.btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--text-muted)}
.btn-ghost:hover{background:var(--bg3);color:var(--text)}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:20px}

/* TOAST */
#toast{position:fixed;bottom:26px;right:26px;background:var(--bg4);border:1px solid var(--border2);border-radius:var(--r);padding:13px 20px;font-size:.87rem;color:var(--text);z-index:9999;transform:translateY(80px);opacity:0;transition:all .3s;max-width:300px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
#toast.show{transform:translateY(0);opacity:1}
#toast.success{border-color:rgba(0,192,96,.4)}
#toast.error{border-color:rgba(220,50,50,.4)}

/* EMPTY */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:64px 20px;text-align:center;color:var(--text-muted);gap:14px;grid-column:1/-1}
.empty-state .icon{font-size:3.2rem;opacity:.5}
.empty-state p{font-size:.88rem;line-height:1.6}

/* HOME */
.home-stats{display:flex;gap:16px;margin-bottom:26px;flex-wrap:wrap}
.stat-block{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);padding:18px 22px;flex:1;min-width:110px}
.stat-number{font-family:'Rajdhani',sans-serif;font-size:2.1rem;font-weight:700;line-height:1}
.stat-label{font-size:.66rem;color:var(--text-muted);letter-spacing:.1em;text-transform:uppercase;margin-top:4px}
.home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.game-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rx);padding:24px 20px;cursor:pointer;transition:transform .25s,box-shadow .25s,border-color .25s;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.game-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px}
.game-card:hover{transform:translateY(-5px)}
.game-card.fn{border-color:rgba(0,212,255,.2)}.game-card.fn::before{background:linear-gradient(90deg,transparent,var(--fn),transparent);opacity:.5}
.game-card.fn:hover{box-shadow:0 10px 36px rgba(0,212,255,.15);border-color:rgba(0,212,255,.35)}
.game-card.fn .game-card-name{color:var(--fn)}
.game-card.rand{border-color:rgba(155,48,255,.2)}.game-card.rand::before{background:linear-gradient(90deg,transparent,var(--epic),transparent);opacity:.5}
.game-card.rand:hover{box-shadow:0 10px 36px rgba(155,48,255,.15);border-color:rgba(155,48,255,.35)}
.game-card.rand .game-card-name{background:linear-gradient(135deg,var(--epic),var(--fn));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.game-card-icon{font-size:1.8rem}
.game-card-name{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:1.15rem;letter-spacing:.04em}
.game-card-count{color:var(--text-muted);font-size:.76rem}

/* RANDOMIZER */
.rand-page{max-width:680px}
.rand-step{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);padding:20px 24px;margin-bottom:16px}
.rand-step-title{display:flex;align-items:center;gap:10px;font-family:'Rajdhani',sans-serif;font-size:1rem;font-weight:700;letter-spacing:.07em;color:var(--text-dim);margin-bottom:14px}
.step-num{width:22px;height:22px;border-radius:50%;background:var(--bg4);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:.75rem;color:var(--text);flex-shrink:0}
.fn-cats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.fn-cat-check{cursor:pointer}
.fn-cat-check input{display:none}
.fn-cat-pill{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:var(--r);border:1px solid var(--border2);background:var(--bg3);font-family:'Rajdhani',sans-serif;font-weight:600;font-size:.85rem;letter-spacing:.05em;color:var(--text-dim);transition:.22s;cursor:pointer;position:relative}
.fn-cat-check input:checked+.fn-cat-pill{background:rgba(0,212,255,.1);border-color:rgba(0,212,255,.4);color:var(--fn)}
.fn-cat-solo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(7,7,10,.88);border:none;border-radius:calc(var(--r) - 1px);color:var(--fn);font-family:'Rajdhani',sans-serif;font-weight:700;font-size:.72rem;letter-spacing:.06em;cursor:pointer;opacity:0;transition:.15s}
.fn-cat-pill:hover .fn-cat-solo{opacity:1}
.fn-cat-pill .cat-icon{font-size:1.1rem}
.rand-btn{font-size:1.05rem;padding:14px 34px;border-radius:var(--rl);background:linear-gradient(135deg,rgba(0,212,255,.22),rgba(155,48,255,.2));border:1px solid rgba(0,212,255,.4);color:#fff;font-family:'Rajdhani',sans-serif;font-weight:700;letter-spacing:.08em;cursor:pointer;transition:.25s;display:flex;align-items:center;gap:10px}
.rand-btn:hover{box-shadow:0 8px 30px rgba(0,212,255,.25)}
/* Animation minimale : léger pulse, sans rotation */
@keyframes spinBounce{0%{transform:scale(1);opacity:1}50%{transform:scale(.95);opacity:.65}100%{transform:scale(1);opacity:1}}
.rand-btn.spinning{animation:spinBounce .4s ease}
.rand-results{margin-top:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.rand-result-card{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--rx);overflow:hidden;position:relative;transition:.25s}
.rand-result-card[data-rarity=Mythic]{border-color:rgba(255,215,0,.3);box-shadow:0 0 20px rgba(255,215,0,.08)}
.rand-result-card[data-rarity=Legendary]{border-color:rgba(255,140,0,.3);box-shadow:0 0 20px rgba(255,140,0,.08)}
.rand-result-card[data-rarity=Epic]{border-color:rgba(155,48,255,.3);box-shadow:0 0 20px rgba(155,48,255,.08)}
.rand-result-card[data-rarity=Rare]{border-color:rgba(30,144,255,.3);box-shadow:0 0 20px rgba(30,144,255,.08)}
.rand-result-img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:var(--bg3)}
.rand-result-img.no-img-big{display:flex;align-items:center;justify-content:center;font-size:3.6rem;background:linear-gradient(135deg,var(--bg3),var(--bg4))}
.rand-result-info{padding:14px 16px 16px;background:linear-gradient(0deg,var(--bg2),transparent)}
.rand-result-cat{font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--text-muted);font-weight:600;margin-bottom:4px}
.rand-result-name{font-family:'Rajdhani',sans-serif;font-size:1.12rem;font-weight:700;letter-spacing:.04em}
.rand-result-sub{font-size:.72rem;color:var(--text-dim);margin-top:3px}

/* SELECT MODE */
.select-mode-bar{display:flex;align-items:center;gap:12px;padding:12px 18px;background:var(--bg2);border:1px solid rgba(0,212,255,.3);border-radius:var(--rl);margin-bottom:18px;flex-wrap:wrap}
.skin-card.selectable{cursor:pointer}
.skin-card.selected{outline:2px solid var(--fn);outline-offset:2px;box-shadow:0 0 20px rgba(0,212,255,.25)}
.skin-card.selected::after{content:'✓';position:absolute;top:8px;left:8px;width:22px;height:22px;background:var(--fn);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;color:#07070a;font-weight:700;z-index:20}

/* LIGHTBOX */
.lightbox-overlay{visibility:hidden;opacity:0;position:fixed;inset:0;background:rgba(0,0,0,.92);backdrop-filter:blur(14px);z-index:9999;cursor:zoom-out;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;padding:24px;transition:opacity .25s,visibility .25s}
.lightbox-overlay.open{visibility:visible;opacity:1}
#lightbox-img{max-width:min(480px,88vw);max-height:80vh;object-fit:contain;border-radius:14px;box-shadow:0 40px 100px rgba(0,0,0,.9);border:1px solid rgba(255,255,255,.12);display:block;transform:scale(.92);transition:transform .25s cubic-bezier(0.4,0,0.2,1)}
.lightbox-overlay.open #lightbox-img{transform:scale(1)}
.lightbox-name{font-family:'Rajdhani',sans-serif;font-size:1rem;font-weight:600;letter-spacing:.07em;color:rgba(255,255,255,.9);background:rgba(0,0,0,.5);padding:6px 18px;border-radius:20px;border:1px solid rgba(255,255,255,.1);white-space:nowrap}

/* VARIANT GROUPS (skin detail modal) — imite l'écran de style Fortnite */
.variant-group{margin-bottom:22px}
.variant-group-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.variant-group-title{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--fn);font-weight:700}
.variant-group-del{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:.7rem;padding:2px 6px;border-radius:4px}
.variant-group-del:hover{color:#ff8a8a;background:rgba(220,50,50,.15)}
.variant-thumbs{display:flex;flex-wrap:wrap;gap:10px;min-height:40px;border-radius:var(--r);transition:.15s;padding:4px}
.variant-thumbs.drag-over{background:rgba(0,212,255,.08);outline:2px dashed rgba(0,212,255,.5);outline-offset:-2px}
.vp-thumb-wrap{cursor:grab}
.vp-thumb-wrap.dragging{opacity:.35}
.vp-card{background:var(--bg4);border:2px solid var(--border);border-radius:var(--rl);overflow:hidden;transition:.2s;position:relative;width:76px;height:76px;flex-shrink:0}
.vp-card.owned{border-color:var(--mythic);box-shadow:0 0 0 1px var(--mythic),0 0 12px rgba(255,215,0,.25)}
.vp-card.locked{opacity:.55}
.vp-card img,.vp-card .vp-noimg{width:100%;height:100%;object-fit:cover;display:block}
.vp-card .vp-noimg{display:flex;align-items:center;justify-content:center;font-size:1.3rem;background:var(--bg5)}
.vp-lock{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35);font-size:1.1rem;pointer-events:none}
.vp-name-label{text-align:center;font-size:.58rem;color:var(--text-dim);margin-top:4px;max-width:76px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vp-thumb-wrap{display:flex;flex-direction:column;align-items:center}
.vp-actions{position:absolute;top:-4px;right:-4px;display:flex;gap:2px;opacity:0;transition:.2s;border-radius:20px}
.vp-card:hover .vp-actions, .vp-thumb-wrap:hover .vp-actions{opacity:1}
.vp-edit-btn,.vp-del-btn,.vp-owned-btn{width:20px;height:20px;border-radius:50%;border:none;color:#fff;font-size:.62rem;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px)}
.vp-edit-btn{background:rgba(255,255,255,.25)}
.vp-del-btn{background:rgba(220,50,50,.7)}
.vp-owned-btn{background:rgba(255,215,0,.35)}

@media (max-width:760px){
  #sidebar{position:relative;width:100%;min-height:auto;flex-direction:row;flex-wrap:wrap;padding:10px}
  #main{margin-left:0;padding:22px 16px}
  .sidebar-nav{display:flex;flex-wrap:wrap;padding:4px}
  .sidebar-bottom{margin-top:0}
}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="sidebar-logo">
      <h1>FN VAULT</h1>
      <span>Fortnite · Bloody</span>
    </div>
    <div class="sidebar-section">Collection</div>
    <nav class="sidebar-nav">
      <div class="nav-item" data-page="home" onclick="navigate('home')"><div class="nav-dot"></div>Accueil</div>
      <div class="nav-item" data-page="collection" onclick="navigate('collection')"><div class="nav-dot"></div>Ma collection</div>
    </nav>
    <div class="sidebar-section">Outils</div>
    <nav class="sidebar-nav">
      <div class="nav-item" data-page="random" onclick="navigate('random')"><div class="nav-dot"></div>🎲 Randomizer</div>
      <div class="nav-item" data-page="add" onclick="navigate('add')"><div class="nav-dot"></div>➕ Ajouter</div>
    </nav>
    <div class="sidebar-bottom">
      <button class="btn btn-ghost btn-sm" onclick="exportData()">⬇ Exporter</button>
      <label class="btn btn-ghost btn-sm" style="cursor:pointer;justify-content:center;">⬆ Importer<input type="file" accept=".json" style="display:none" onchange="handleImport(event)"></label>
    </div>
  </aside>
  <main id="main"><div id="page-content"></div></main>
</div>

<div class="modal-overlay" id="modal-overlay" onclick="closeModalOnBg(event)">
  <div class="modal" id="modal">
    <div class="modal-header">
      <span class="modal-title" id="modal-title">Détail</span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>
<div id="toast"></div>

<div class="lightbox-overlay" id="lightbox" onclick="closeLightbox()">
  <img id="lightbox-img" src="" alt="" style="display:none">
  <div class="lightbox-name" id="lightbox-name"></div>
</div>

<script>
// ═══════════════════════════════════════════════════════
//  DATA
// ═══════════════════════════════════════════════════════
const DB_KEY = 'fnvault_data';
const FN_CATS = {
  skin:       {label:'Skin',              icon:'👤'},
  back_bling: {label:'Accessoire de dos', icon:'🎒'},
  pickaxe:    {label:'Pioche',            icon:'⛏️'},
  glider:     {label:'Planeur',           icon:'🪂'},
  contrail:   {label:'Traînée',           icon:'✨'},
  shoes:      {label:'Chaussures',        icon:'👟'},
  aura:       {label:'Aura',              icon:'🌟'},
  guitar:     {label:'Guitare',           icon:'🎸'},
  bass:       {label:'Basse',             icon:'🎵'},
  keytar:     {label:'Keytar',            icon:'🎹'},
  drums:      {label:'Batterie',          icon:'🥁'},
  mic:        {label:'Micro',             icon:'🎤'},
};
const DEFAULT_DATA = {
  series: ["Icon Series","Marvel Series","DC Series","Gaming Legends","Star Wars","Lego","Collab"],
  items: {} // { skin: [], back_bling: [], pickaxe: [], ... }
};

function loadData() {
  try {
    const raw = localStorage.getItem(DB_KEY);
    if (!raw) return JSON.parse(JSON.stringify(DEFAULT_DATA));
    const saved = JSON.parse(raw);
    if(!saved.items) saved.items={};
    if(!saved.series) saved.series=[...DEFAULT_DATA.series];
    // Migration : anciennes variantes à plat -> groupe "Variantes" par défaut
    // (une seule fois : ensuite s.variants sert de bac "sans groupe" pour les nouvelles variantes libres)
    (saved.items.skin||[]).forEach(s=>{
      if(!s.variantGroups) {
        s.variantGroups = (s.variants&&s.variants.length)
          ? [{id:generateId('vg'), name:'Variantes', variants:s.variants.map(v=>({...v, owned:true}))}]
          : [];
        s.variants = [];
      }
      if(!s.variants) s.variants=[];
    });
    return saved;
  } catch(e) { return JSON.parse(JSON.stringify(DEFAULT_DATA)); }
}
function saveData(d) { localStorage.setItem(DB_KEY, JSON.stringify(d)); }
function generateId(p) { return p+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,7); }

function exportData() {
  const d = loadData();
  const blob = new Blob([JSON.stringify(d,null,2)],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url;
  a.download=`fnvault_${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(url);
}
// Importe soit un export FN Vault ({series, items}), soit un ancien export
// SkinVault complet qui contient une clé "fortnite": {series, items}.
function importData(file) {
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = e => {
      try {
        const raw = JSON.parse(e.target.result);
        let d;
        if(raw && raw.items && typeof raw.items==='object') { d = { series: raw.series||[...DEFAULT_DATA.series], items: raw.items }; }
        else if(raw && raw.fortnite && raw.fortnite.items) { d = { series: raw.fortnite.series||[...DEFAULT_DATA.series], items: raw.fortnite.items }; }
        else { throw new Error("Format non reconnu (ni export FN Vault, ni export SkinVault avec une section fortnite)"); }
        saveData(d); res(d);
      } catch(err) { rej(err instanceof Error ? err : new Error('JSON invalide')); }
    };
    r.readAsText(file);
  });
}
async function handleImport(e) {
  const f=e.target.files[0]; if(!f) return;
  try { const d=await importData(f); const n=Object.values(d.items).reduce((a,arr)=>a+(arr?.length||0),0); showToast(`Import réussi ✓ (${n} items)`); refresh(); }
  catch(err) { showToast('Erreur : '+err.message,'error'); }
  e.target.value='';
}

// ═══════════════════════════════════════════════════════
//  APP / NAVIGATION
// ═══════════════════════════════════════════════════════
let currentPage = 'home';

function navigate(page) {
  currentPage = page;
  _exitSelectMode(true);
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active', el.dataset.page===page));
  const c = document.getElementById('page-content');
  switch(page) {
    case 'home':       c.innerHTML = renderHome(); break;
    case 'collection': c.innerHTML = renderFN(); break;
    case 'random':      c.innerHTML = renderRandom(); break;
    case 'add':          c.innerHTML = renderAdd(); setTimeout(_populateFNSkinSelect,50); break;
    default: c.innerHTML='<p>404</p>';
  }
}
function refresh() { navigate(currentPage); }

// Modal
function openModal(title, body) {
  document.getElementById('modal-title').textContent=title;
  document.getElementById('modal-body').innerHTML=body;
  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); document.body.style.overflow=''; }
function closeModalOnBg(e) { if(e.target===document.getElementById('modal-overlay')) closeModal(); }

// Toast
let _tt;
function showToast(msg,type='success') {
  const t=document.getElementById('toast');
  t.textContent=msg; t.className=`show ${type}`;
  clearTimeout(_tt); _tt=setTimeout(()=>{t.className='';},3000);
}

// Lightbox
function openLightbox(src, name) {
  if(!src) return;
  const lb = document.getElementById('lightbox');
  const img = document.getElementById('lightbox-img');
  const nm = document.getElementById('lightbox-name');
  img.src = src; img.style.display = 'block';
  nm.textContent = name || '';
  lb.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
  setTimeout(() => { document.getElementById('lightbox-img').src = ''; }, 300);
}

// Utils
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function previewUrl(inputId, previewId) {
  const url = document.getElementById(inputId)?.value.trim();
  const img = document.getElementById(previewId);
  if(!img) return;
  if(url) { img.src=url; img.classList.add('show'); } else { img.classList.remove('show'); }
}
function rand(arr) { return arr[Math.floor(Math.random()*arr.length)]; }
// Couleur déterministe par série (même nom = toujours la même couleur)
const SERIES_PALETTE = ['#ff6b6b','#feca57','#48dbfb','#1dd1a1','#a78bfa','#ff9ff3','#54a0ff','#ff9f43','#00d2d3','#f368e0'];
function seriesColor(name) {
  const s = String(name||'');
  let hash = 0;
  for(let i=0;i<s.length;i++) hash = (hash*31 + s.charCodeAt(i)) | 0;
  return SERIES_PALETTE[Math.abs(hash) % SERIES_PALETTE.length];
}
// Poids 1-10 : 1 = très rare, 5 = normal, 10 = très fréquent
function randWeighted(arr) {
  if(!arr || !arr.length) return null;
  const total = arr.reduce((s,x) => s + (x.weight||5), 0);
  let r = Math.random() * total;
  for(const item of arr) {
    r -= (item.weight||5);
    if(r <= 0) return item;
  }
  return arr[arr.length-1];
}

// ── Widget probabilité ──
function weightWidget(fieldId, defaultVal=5) {
  return `<div class="form-group">
    <label>🎲 Probabilité dans le randomizer</label>
    <div class="weight-wrap">
      <span class="weight-label">Rare</span>
      <input type="range" class="weight-slider" id="${fieldId}" min="1" max="10" value="${defaultVal}"
        oninput="updateWeightPips('${fieldId}')">
      <span class="weight-label">Fréquent</span>
      <span class="weight-value" id="${fieldId}-val">${defaultVal}</span>
    </div>
    <div class="weight-bar-row" id="${fieldId}-pips">
      ${Array.from({length:10},(_,i)=>`<div class="weight-pip ${i<defaultVal?'on':''}" id="${fieldId}-pip-${i+1}"></div>`).join('')}
    </div>
    <div style="font-size:.67rem;color:var(--text-muted);margin-top:4px">1 = très rare · 5 = normal · 10 = très fréquent</div>
  </div>`;
}
function updateWeightPips(fieldId) {
  const val = parseInt(document.getElementById(fieldId)?.value||5);
  const valEl = document.getElementById(fieldId+'-val');
  if(valEl) { valEl.textContent=val; }
  for(let i=1;i<=10;i++) {
    const pip = document.getElementById(fieldId+'-pip-'+i);
    if(pip) pip.classList.toggle('on', i<=val);
  }
}
function getWeight(fieldId) { return parseInt(document.getElementById(fieldId)?.value||5); }

// ═══════════════════════════════════════════════════════
//  HOME
// ═══════════════════════════════════════════════════════
function renderHome() {
  const db=loadData();
  const items = db.items||{};
  const total = Object.values(items).reduce((a,arr)=>a+(arr?.length||0),0);
  const skinCount = (items.skin||[]).length;
  const festCount = (items.skin||[]).filter(s=>s.forFestival).length;
  return `
    <div class="page-header"><div><div class="page-title" style="color:var(--text)">MA COLLECTION</div><div style="color:var(--text-muted);font-size:.8rem;margin-top:4px;letter-spacing:.1em">FN VAULT · BLOODY</div></div><button class="btn btn-primary" onclick="navigate('add')">➕ Ajouter</button></div>
    <div class="home-stats">
      <div class="stat-block"><div class="stat-number">${total}</div><div class="stat-label">Items total</div></div>
      <div class="stat-block"><div class="stat-number">${skinCount}</div><div class="stat-label">Skins</div></div>
      <div class="stat-block"><div class="stat-number">${db.series.length}</div><div class="stat-label">Séries</div></div>
      <div class="stat-block"><div class="stat-number">${festCount}</div><div class="stat-label">🎸 Skins Festival</div></div>
    </div>
    <div class="home-grid">
      <div class="game-card fn" onclick="navigate('collection')">
        <div class="game-card-icon">⚡</div>
        <div class="game-card-name">Ma collection</div>
        <div class="game-card-count">${total} item${total!==1?'s':''}</div>
      </div>
      <div class="game-card rand" onclick="navigate('random')">
        <div class="game-card-icon">🎲</div>
        <div class="game-card-name">Randomizer</div>
        <div class="game-card-count">Choix aléatoire</div>
      </div>
    </div>`;
}

// ═══════════════════════════════════════════════════════
//  COLLECTION FORTNITE
// ═══════════════════════════════════════════════════════
function renderFN() {
  const db=loadData();
  const items=db.items||{};
  const total=Object.values(items).reduce((a,arr)=>a+(arr?.length||0),0);
  return `
    <div class="page-header fn-page"><div class="page-title fn-accent">MA COLLECTION</div>
      <div style="display:flex;gap:8px;align-items:center">
        <span class="count-badge">${total} items</span>
        <button class="btn btn-ghost btn-sm" onclick="fnSortAlpha('asc')" title="Trier A→Z">🔤 A→Z</button>
        <button class="btn btn-ghost btn-sm" onclick="fnSortAlpha('desc')" title="Trier Z→A">🔤 Z→A</button>
        <button class="btn btn-ghost btn-sm" onclick="fnSortRecent()" title="Dernier ajout en premier">🕒 Dernier ajout</button>
        <button class="btn btn-ghost btn-sm" onclick="toggleSelectMode('fortnite',{cat:_fnCat})">☑ Sélectionner</button>
      </div>
    </div>
    <div class="tabs" id="fn-cat-tabs">
      ${Object.entries(FN_CATS).map(([k,v],i)=>`<button type="button" class="tab ${k===_fnCat?'active':''}" data-cat="${k}" onclick="fnSwitchCat(this,'${k}')">${v.icon} ${v.label}</button>`).join('')}
    </div>
    <div id="select-bar-container"></div>
    <div class="search-bar"><div class="search-input-wrap"><span class="search-icon">🔍</span><input type="text" placeholder="Rechercher…" id="fn-search" oninput="fnFilter()"></div></div>
    <div class="filter-bar" id="fn-rarity-filter">
      ${['all','Mythic','Legendary','Epic','Rare','Uncommon','Common'].map((r,i)=>`<button class="filter-btn ${i===0?'active':''}" data-rarity="${r}" onclick="fnRarFilter(this,'${r}')">${r==='all'?'Tous':r}</button>`).join('')}
    </div>
    <div class="skins-grid" id="fn-grid">${renderFnGrid(_fnCat, items)}</div>`;
}

let _fnCat = 'skin';
function fnSwitchCat(btn, cat) {
  _fnCat=cat;
  _exitSelectMode(true);
  document.querySelectorAll('#fn-cat-tabs .tab').forEach(t=>t.classList.toggle('active',t.dataset.cat===cat));
  document.getElementById('fn-grid').innerHTML = renderFnGrid(cat, loadData().items||{});
}
function fnSortAlpha(dir) {
  const db = loadData();
  if(!db.items[_fnCat]) return;
  db.items[_fnCat].sort((a,b)=> dir==='asc' ? a.name.localeCompare(b.name,'fr') : b.name.localeCompare(a.name,'fr'));
  saveData(db);
  showToast('Trié par ordre alphabétique ✓');
  document.getElementById('fn-grid').innerHTML = renderFnGrid(_fnCat, db.items);
}
function idTimestamp(id) {
  const parts = String(id).split('_');
  const ts = parseInt(parts[1]);
  return isNaN(ts) ? 0 : ts;
}
function fnSortRecent() {
  const db = loadData();
  if(!db.items[_fnCat]) return;
  db.items[_fnCat].sort((a,b)=> idTimestamp(b.id) - idTimestamp(a.id));
  saveData(db);
  showToast('Trié par dernier ajout ✓');
  document.getElementById('fn-grid').innerHTML = renderFnGrid(_fnCat, db.items);
}
function renderFnGrid(cat, items) {
  const list=items[cat]||[];
  if(!list.length) return `<div class="empty-state"><div class="icon">${FN_CATS[cat]?.icon||'🎮'}</div><p>Aucun ${FN_CATS[cat]?.label.toLowerCase()||cat} pour l'instant.<br>Ajoute-en depuis <strong>➕ Ajouter</strong>.</p></div>`;
  return list.map(s=>`
    <div class="skin-card" data-rarity="${esc(s.rarity||'')}" data-name="${esc((s.name||'').toLowerCase())}" data-id="${esc(s.id)}"
      onclick="fnCardClick(event,this,'${esc(s.id)}','${cat}')" style="cursor:pointer">
      <div class="rarity-bar ${esc(s.rarity||'')}"></div>
      <div class="skin-img-wrap">
        ${s.image?`<img src="${esc(s.image)}" alt="${esc(s.name)}" loading="lazy" onerror="this.parentNode.innerHTML='<div class=\\'no-img\\'>${FN_CATS[cat]?.icon||'🎮'}</div>'">`:`<div class="no-img">${FN_CATS[cat]?.icon||'🎮'}</div>`}
      </div>
      <div class="skin-info">
        <div class="skin-name">${esc(s.name)}</div>
        <div class="skin-meta"><span class="skin-rarity-label ${esc(s.rarity||'')}">${esc(s.rarity||'')}</span>${s.series?`<span class="skin-series-badge" style="color:${seriesColor(s.series)};border-color:${seriesColor(s.series)}55;background:${seriesColor(s.series)}15">${esc(s.series)}</span>`:''}</div>
        ${cat==='skin'&&((s.variantGroups&&s.variantGroups.length)||(s.variants&&s.variants.length))?`<div style="font-size:.63rem;color:var(--fn);margin-top:3px">${(()=>{const gc=(s.variantGroups||[]).length;const vc=(s.variantGroups||[]).reduce((a,g)=>a+g.variants.length,0)+((s.variants||[]).length);return `${gc?gc+' groupe'+(gc>1?'s':'')+' · ':''}${vc} variante${vc>1?'s':''}`;})()}</div>`:''}
        ${cat==='skin'&&s.forFestival?`<div class="festival-tag">🎸 Festival</div>`:''}
        ${s.weight&&s.weight!==5?`<div class="skin-weight-tag">🎲 ×${s.weight}</div>`:''}
        ${s.notes?`<div class="skin-note" title="${esc(s.notes)}">📝 ${esc(s.notes)}</div>`:''}
      </div>
      <div class="card-actions" onclick="event.stopPropagation()">
        <button class="card-btn card-btn-edit" onclick="fnEditItem('${esc(cat)}','${esc(s.id)}')">✏</button>
        <button class="card-btn card-btn-delete" onclick="fnDeleteItem('${esc(cat)}','${esc(s.id)}')">🗑</button>
      </div>
    </div>`).join('');
}
function fnCardClick(e, card, id, cat) {
  _cardClick(card, ()=>{
    if(cat==='skin') { fnOpenModal(id); return; }
    const db = loadData();

function fnDeleteItem(cat, id) {

function fnOpenModal(id) {
  const db=loadData();
  const s=(db.items['skin']||[]).find(x=>x.id===id);
  if(!s) return;
  const groups=s.variantGroups||[];
  const ungrouped=s.variants||[];
  const rarityColor={Mythic:'var(--mythic)',Legendary:'var(--legendary)',Epic:'var(--epic)',Rare:'var(--rare)',Uncommon:'var(--uncommon)',Common:'var(--common)'}[s.rarity]||'var(--text-muted)';

  const ungroupedHTML = (ungrouped.length===0 && groups.length>0) ? '' : `
      <div class="variant-group" data-group-id="_ungrouped">
        <div class="variant-group-header">
          <span class="variant-group-title" style="color:var(--text-dim)">🎲 Sans groupe · ${ungrouped.length}</span>
        </div>
        <div class="variant-thumbs" data-drop-group="_ungrouped">
          ${ungrouped.length===0?`<div style="font-size:.7rem;color:var(--text-muted);font-style:italic;padding:8px">Variantes libres, pas besoin de groupe — glisse-en une ici, ou ajoute-en depuis ➕ Ajouter</div>`:''}
          ${ungrouped.map(v=>_renderVariantThumb(s, '_ungrouped', v)).join('')}
        </div>
      </div>`;

  const groupsHTML = groups.map(g=>`
      <div class="variant-group" data-group-id="${esc(g.id)}">
        <div class="variant-group-header">
          <span class="variant-group-title">${esc(g.name)} · ${g.variants.length}</span>
          <button class="variant-group-del" data-skin-id="${esc(s.id)}" data-group-id="${esc(g.id)}">🗑 Supprimer le groupe</button>
        </div>
        <div class="variant-thumbs" data-drop-group="${esc(g.id)}">
          ${g.variants.length===0?`<div style="font-size:.7rem;color:var(--text-muted);font-style:italic;padding:8px">Glisse une variante ici</div>`:''}
          ${g.variants.map(v=>_renderVariantThumb(s, g.id, v)).join('')}
        </div>
      </div>`).join('');

  openModal(s.name, `
    <div style="display:flex;flex-direction:column;gap:0">
      <div class="fn-modal-main" data-img="${esc(s.image||'')}" data-name="${esc(s.name)}"
           style="width:100%;background:var(--bg3);border-radius:var(--rl);overflow:hidden;cursor:${s.image?'zoom-in':'default'};position:relative;margin-bottom:20px">
        ${s.image
          ? `<img src="${esc(s.image)}" style="width:100%;max-height:380px;object-fit:contain;display:block">`
          : `<div style="height:200px;display:flex;align-items:center;justify-content:center;font-size:4rem">⚡</div>`}
        ${s.image?`<div style="position:absolute;bottom:10px;right:10px;background:rgba(0,0,0,.6);border-radius:6px;padding:4px 8px;font-size:.65rem;color:var(--text-muted);backdrop-filter:blur(4px)">🔍 Agrandir</div>`:''}
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px">
        ${s.rarity?`<span style="padding:5px 14px;border-radius:20px;font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:${rarityColor};border:1px solid ${rarityColor}40;background:rgba(0,0,0,.3)">${esc(s.rarity)}</span>`:''}
        ${s.series?`<span style="padding:5px 14px;border-radius:20px;font-size:.72rem;font-weight:600;background:${seriesColor(s.series)}18;color:${seriesColor(s.series)};border:1px solid ${seriesColor(s.series)}55">🏷 ${esc(s.series)}</span>`:''}
        ${s.forFestival?`<span style="padding:5px 14px;border-radius:20px;font-size:.72rem;font-weight:600;background:rgba(255,107,53,.1);color:var(--festival);border:1px solid rgba(255,107,53,.35)">🎸 Festival</span>`:''}
      </div>
      ${s.notes?`<div style="background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-bottom:18px;font-size:.85rem;color:var(--text-dim);white-space:pre-wrap">📝 ${esc(s.notes)}</div>`:''}
      ${(groups.length===0 && ungrouped.length===0)?`<p style="color:var(--text-muted);font-size:.82rem;margin-top:6px">Aucune variante enregistrée. Ajoutes-en depuis <strong>➕ Ajouter</strong> (avec ou sans groupe).</p>`:''}
      ${ungroupedHTML}
      ${groupsHTML}
    </div>
  `);

  setTimeout(() => {
    const mainEl = document.querySelector('.fn-modal-main');
    if(mainEl) mainEl.addEventListener('click', () => {
      const src = mainEl.dataset.img, nm = mainEl.dataset.name;
      if(src) openLightbox(src, nm);
    });
    document.querySelectorAll('.vp-card').forEach(card => {
      const imgEl = card.querySelector('img, .vp-noimg');
      if(imgEl) imgEl.addEventListener('click', () => { const src=card.dataset.img, nm=card.dataset.name; if(src) openLightbox(src, nm); });
    });
    document.querySelectorAll('.vp-owned-btn').forEach(btn => btn.addEventListener('click', e => { e.stopPropagation(); fnToggleVariantOwned(btn.dataset.skinId, btn.dataset.groupId, btn.dataset.varId); }));
    document.querySelectorAll('.vp-edit-btn').forEach(btn => btn.addEventListener('click', e => { e.stopPropagation(); fnEditVariant(btn.dataset.skinId, btn.dataset.groupId, btn.dataset.varId); }));
    document.querySelectorAll('.vp-del-btn').forEach(btn => btn.addEventListener('click', e => { e.stopPropagation(); fnDeleteVariant(btn.dataset.skinId, btn.dataset.groupId, btn.dataset.varId); }));
    document.querySelectorAll('.variant-group-del').forEach(btn => btn.addEventListener('click', e => { e.stopPropagation(); fnDeleteVariantGroup(btn.dataset.skinId, btn.dataset.groupId); }));

    // Glisser-déposer une variante d'un groupe à un autre
    document.querySelectorAll('.vp-thumb-wrap').forEach(wrap => {
      wrap.addEventListener('dragstart', e => {
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', JSON.stringify({
          skinId: wrap.dataset.dragSkin, groupId: wrap.dataset.dragGroup, varId: wrap.dataset.dragVar
        }));
        wrap.classList.add('dragging');
      });
      wrap.addEventListener('dragend', () => wrap.classList.remove('dragging'));
    });
    document.querySelectorAll('.variant-thumbs').forEach(zone => {
      zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
      zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
      zone.addEventListener('drop', e => {
        e.preventDefault();
        zone.classList.remove('drag-over');
        let payload;
        try { payload = JSON.parse(e.dataTransfer.getData('text/plain')); } catch(err) { return; }
        const targetGroupId = zone.dataset.dropGroup;
        if(payload && targetGroupId) fnMoveVariantToGroup(payload.skinId, payload.groupId, payload.varId, targetGroupId);
      });
    });
  }, 50);
}
function _variantBucket(skin, groupId) {
  if(groupId==='_ungrouped') { if(!skin.variants) skin.variants=[]; return {name:'Sans groupe', variants: skin.variants}; }
  return skin.variantGroups.find(g=>g.id===groupId);
}
function fnMoveVariantToGroup(skinId, fromGroupId, varId, toGroupId) {
  if(fromGroupId===toGroupId) return;
  const db = loadData();
  const skin = (db.items['skin']||[]).find(s=>s.id===skinId);
  if(!skin) return;
  const fromGroup = _variantBucket(skin, fromGroupId);
  const toGroup = _variantBucket(skin, toGroupId);
  if(!fromGroup||!toGroup) return;
  const idx = fromGroup.variants.findIndex(v=>v.id===varId);
  if(idx===-1) return;
  const [v] = fromGroup.variants.splice(idx,1);
  toGroup.variants.push(v);
  saveData(db);
  showToast(`Déplacée dans "${toGroup.name}" ✓`);
  fnOpenModal(skinId);
}
function fnToggleVariantOwned(skinId, groupId, varId) {
  const db = loadData();
  const skin = (db.items['skin']||[]).find(s=>s.id===skinId);
  const group = skin && _variantBucket(skin, groupId);
  const v = group?.variants.find(x=>x.id===varId);
  if(!v) return;
  v.owned = !v.owned;
  saveData(db); fnOpenModal(skinId);
}
function fnDeleteVariantGroup(skinId, groupId) {
  if(!confirm('Supprimer ce groupe et toutes ses variantes ?')) return;
  const db = loadData();
  const skin = (db.items['skin']||[]).find(s=>s.id===skinId);
  if(!skin) return;
  skin.variantGroups = skin.variantGroups.filter(g=>g.id!==groupId);
  saveData(db); showToast('Groupe supprimé ✓'); fnOpenModal(skinId);
}
function fnDeleteVariant(skinId, groupId, varId) {
  if(!confirm('Supprimer cette variante ?')) return;
  const db = loadData();
  const skin = (db.items['skin']||[]).find(s=>s.id===skinId);
  const group = skin && _variantBucket(skin, groupId);
  if(!group) return;
  group.variants = group.variants.filter(v=>v.id!==varId);
  saveData(db); showToast('Variante supprimée ✓'); fnOpenModal(skinId);
}
function fnEditVariant(skinId, groupId, varId) {
  const db = loadData();
  const skin = (db.items['skin']||[]).find(s=>s.id===skinId);
  const group = skin && _variantBucket(skin, groupId);
  const v = group?.variants.find(x=>x.id===varId);
  if(!v) return;
  openModal(`Modifier : ${esc(v.name)}`, `
    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="form-group"><label>Nom de la variante</label><input type="text" id="edit-var-name" value="${esc(v.name)}"></div>
      <div class="form-group"><label>URL image</label><input type="url" id="edit-var-img" value="${esc(v.image||'')}" placeholder="https://..."></div>
      <label class="festival-toggle" style="text-transform:none;letter-spacing:0"><input type="checkbox" id="edit-var-owned" ${v.owned?'checked':''}><span>Possédée</span></label>
      <div style="display:flex;gap:10px">
        <button class="btn btn-primary" onclick="fnSaveVariantEdit('${esc(skinId)}','${esc(groupId)}','${esc(varId)}')">💾 Enregistrer</button>
        <button class="btn btn-ghost" onclick="fnOpenModal('${esc(skinId)}')">✕ Annuler</button>
      </div>
    </div>`);
}
function fnSaveVariantEdit(skinId, groupId, varId) {
  const name = document.getElementById('edit-var-name')?.value.trim();
  const image = document.getElementById('edit-var-img')?.value.trim();
  const owned = document.getElementById('edit-var-owned')?.checked;
  if(!name) { showToast('Le nom est requis','error'); return; }
  const db = loadData();
  const skin = (db.items['skin']||[]).find(s=>s.id===skinId);
  const group = skin && _variantBucket(skin, groupId);
  const v = group?.variants.find(x=>x.id===varId);
  if(!v) return;
  v.name = name; v.image = image||null; v.owned = !!owned;
  saveData(db); showToast('Variante modifiée ✓'); fnOpenModal(skinId);
}

function saveFNVariantGroup(){
  const parentId=document.getElementById('fn-group-parent')?.value;

  const skin=(db.items['skin']||[]).find(s=>s.id===parentId);
  if(!skin){showToast('Skin introuvable','error');return;}

function saveFNVariant(){
  const parentId=document.getElementById('fn-var-parent')?.value;
  const groupId=document.getElementById('fn-var-group')?.value;
  const name=document.getElementById('fn-var-name')?.value.trim();
  const image=document.getElementById('fn-var-img')?.value.trim();
  const owned=document.getElementById('fn-var-owned')?.checked;
  if(!parentId||!name){showToast('Choisis un skin et donne un nom','error');return;}
  const db=loadData();
  const skin=(db.items['skin']||[]).find(s=>s.id===parentId);
  if(!skin){showToast('Skin introuvable','error');return;}
  let targetArr;
  if(groupId) {
    const group = skin.variantGroups.find(g=>g.id===groupId);
    if(!group){showToast('Groupe introuvable','error');return;}
    targetArr = group.variants;
  } else {
    if(!skin.variants) skin.variants=[];
    targetArr = skin.variants;
  }
  targetArr.push({id:generateId('fnv'),name,image:image||null,owned:!!owned});

function saveFNItem(e){
  e.preventDefault();
  const cat=document.getElementById('fn-cat').value;
  const name=document.getElementById('fn-name').value.trim();
  const rarity=document.getElementById('fn-rarity').value;
  const series=document.getElementById('fn-series').value;
  const image=document.getElementById('fn-img-url').value.trim();
  const forFestival=document.getElementById('fn-festival-check')?.checked||false;
  const weight=getWeight('fn-weight');
  const notes=document.getElementById('fn-notes').value.trim();
  if(!name) { showToast('Le nom est requis','error'); return; }
  const db=loadData();
  const form=e.target;
  const editId=form.dataset.editId;
  const editCat=form.dataset.editCat;
  if(editId&&editCat){
    const list=db.items[editCat]||[];
    const idx=list.findIndex(x=>x.id===editId);
    if(idx!==-1){
      const old=list[idx];
      const updated={...old,name,rarity,series:series||null,image:image||old.image,forFestival,weight,notes:notes||null};
      if(editCat!==cat){
        list.splice(idx,1);
        if(!db.items[cat]) db.items[cat]=[];
        db.items[cat].push(updated);
      } else {
        list[idx]=updated;
      }
    }
    saveData(db); showToast('Item modifié ✓'); navigate('collection'); _fnCat=cat; fnSwitchCat(document.querySelector(`[data-cat="${cat}"]`)||{classList:{toggle(){}}},cat);
  } else {
    if(!db.items[cat]) db.items[cat]=[];
    db.items[cat].unshift({id:generateId('fn'),name,rarity,series:series||null,image:image||null,variantGroups:[],forFestival,weight,notes:notes||null});
    saveData(db); showToast('Item Fortnite ajouté ✓');
    _fnCat=cat;
    document.getElementById('page-content').innerHTML = renderAdd();
    setTimeout(_populateFNSkinSelect,50);
  }
}
function fnEditItem(cat, id) {
  navigate('add');
  setTimeout(()=>{
    const db=loadData();
    const s=(db.items[cat]||[]).find(x=>x.id===id);
    if(!s) return;
    document.getElementById('fn-cat').value=cat;
    document.getElementById('fn-name').value=s.name;
    document.getElementById('fn-rarity').value=s.rarity||'';
    document.getElementById('fn-series').value=s.series||'';
    document.getElementById('fn-img-url').value=s.image||'';
    document.getElementById('fn-notes').value=s.notes||'';
    const prev=document.getElementById('fn-img-preview');
    if(prev&&s.image){prev.src=s.image;prev.classList.add('show');}
    const festCheck=document.getElementById('fn-festival-check');
    if(festCheck) festCheck.checked=s.forFestival||false;
    const weightInput=document.getElementById('fn-weight');
    if(weightInput) weightInput.value=s.weight||5;
    updateWeightPips('fn-weight');
    const submitBtn=document.getElementById('fn-submit-btn');
    if(submitBtn) submitBtn.textContent='💾 Enregistrer les modifications';
    const form=document.querySelector('#page-content form');
    if(form){form.dataset.editId=id; form.dataset.editCat=cat;}
    showToast('Item chargé pour modification');
  },60);
}

// ═══════════════════════════════════════════════════════
//  RANDOMIZER
// ═══════════════════════════════════════════════════════
function renderRandom(){
  return `
    <div class="rand-page">
      <div class="page-header" style="position:relative">
        <div><div class="page-title" style="background:linear-gradient(135deg,var(--fn),var(--epic));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">RANDOMIZER</div><div style="color:var(--text-muted);font-size:.8rem;margin-top:4px;letter-spacing:.1em">CHOIX ALÉATOIRE</div></div>
      </div>
      <div class="rand-step">
        <div class="rand-step-title" style="justify-content:space-between;display:flex;align-items:center">
          <span style="display:flex;align-items:center;gap:10px"><div class="step-num">1</div>Choisir les catégories à randomizer</span>
          <span style="display:flex;gap:6px">
            <button type="button" class="btn btn-ghost btn-sm" onclick="fnCatsSetAll(true)">☑ Tout cocher</button>
            <button type="button" class="btn btn-ghost btn-sm" onclick="fnCatsSetAll(false)">☐ Tout décocher</button>
          </span>
        </div>
        <div class="fn-cats-grid">
          ${Object.entries(FN_CATS).map(([k,v])=>`
            <label class="fn-cat-check">
              <input type="checkbox" value="${k}" checked>
              <div class="fn-cat-pill"><span class="cat-icon">${v.icon}</span>${v.label}<button type="button" class="fn-cat-solo" onclick="event.preventDefault();fnCatSolo('${k}')" title="Sélectionner seulement celle-ci">Seulement</button></div>
            </label>`).join('')}
        </div>
      </div>
      <div class="rand-step" style="padding:14px 20px">
        <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
          <span style="font-size:.8rem;color:var(--text-muted);letter-spacing:.08em;text-transform:uppercase;font-weight:600">Filtre :</span>
          <label class="festival-toggle"><input type="checkbox" id="fn-rand-festival-only"><span>🎸 Skins Festival seulement</span></label>
        </div>
      </div>
      <div style="display:flex;justify-content:center;margin:24px 0">
        <button class="rand-btn" onclick="doRandFN()">🎲 Randomizer !</button>
      </div>
      <div class="rand-results" id="fn-rand-results"></div>
    </div>`;
}
function fnCatsSetAll(state) {
  document.querySelectorAll('.fn-cat-check input[type=checkbox]').forEach(i=>i.checked=state);
}
function fnCatSolo(cat) {
  document.querySelectorAll('.fn-cat-check input[type=checkbox]').forEach(i=>i.checked=(i.value===cat));
}
function doRandFN(){
  const db=loadData();
  const items=db.items||{};
  const checked=[...document.querySelectorAll('.fn-cat-check input:checked')].map(i=>i.value);
  if(!checked.length){showToast('Coche au moins une catégorie','error');return;}
  const btn=document.querySelector('.rand-btn'); if(btn){btn.classList.add('spinning'); setTimeout(()=>btn.classList.remove('spinning'),600);}
  const festOnly = document.getElementById('fn-rand-festival-only')?.checked;
  const results=[];
  for(const cat of checked){
    let list=items[cat]||[];
    if(cat==='skin' && festOnly) list=list.filter(s=>s.forFestival);
    if(list.length) results.push({cat,item:randWeighted(list)});
  }
  const c=document.getElementById('fn-rand-results');
  if(!results.length){c.innerHTML=`<div class="empty-state" style="grid-column:1/-1"><div class="icon">😅</div><p>Aucun item dans les catégories sélectionnées.<br>Ajoute des skins d'abord !</p></div>`;return;}
  c.innerHTML=results.map(({cat,item})=>{
    const allVariants = cat==='skin' ? [
      ...(item.variantGroups||[]).flatMap(g=>g.variants.map(v=>({...v, groupName:g.name}))),
      ...(item.variants||[]).map(v=>({...v, groupName:'Sans groupe'}))
    ] : [];
    const hasVariants = allVariants.length>0;
    const variant = hasVariants ? rand(allVariants) : null;
    const variantSection = hasVariants ? `
      <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border)">
        <div style="font-size:.62rem;letter-spacing:.15em;text-transform:uppercase;color:var(--fn);margin-bottom:8px;font-weight:600">✨ ${esc(variant.groupName)} suggéré${variant.owned?'':' (non possédé)'}</div>
        <div style="display:flex;align-items:center;gap:10px">
          ${variant.image
            ? `<img src="${esc(variant.image)}" style="width:70px;height:70px;object-fit:cover;border-radius:8px;border:1px solid var(--border2)${variant.owned?';box-shadow:0 0 0 2px var(--mythic)':''}" loading="lazy" onerror="this.style.display='none'">`
            : `<div style="width:70px;height:70px;border-radius:8px;background:var(--bg4);display:flex;align-items:center;justify-content:center;font-size:2rem">⚡</div>`}
          <div>
            <div style="font-size:.88rem;color:var(--text);font-weight:600">${esc(variant.name)}</div>
            <div style="font-size:.7rem;color:var(--text-muted);margin-top:2px">${allVariants.length} variante${allVariants.length>1?'s':''} au total</div>
          </div>
        </div>
      </div>` : '';
    return `
    <div class="rand-result-card" data-rarity="${esc(item.rarity||'')}" data-img="${esc(item.image||'')}" data-name="${esc(item.name)}" style="${item.image?'cursor:zoom-in':''}">
      ${item.image?`<img src="${esc(item.image)}" class="rand-result-img" loading="lazy" onerror="this.style.display='none'">`:`<div class="rand-result-img no-img-big">${FN_CATS[cat]?.icon||'🎮'}</div>`}
      <div class="rand-result-info">
        <div class="rand-result-cat">${FN_CATS[cat]?.label||cat}</div>
        <div class="rand-result-name">${esc(item.name)}</div>
        ${item.rarity?`<div class="rand-result-sub" style="color:var(--${item.rarity.toLowerCase()})">${esc(item.rarity)}</div>`:''}
        ${item.series?`<div class="rand-result-sub" style="color:${seriesColor(item.series)}">🏷 ${esc(item.series)}</div>`:''}
        ${item.forFestival?`<div class="rand-result-sub" style="color:var(--festival)">🎸 Festival</div>`:''}
        ${variantSection}
      </div>
    </div>`;
  }).join('');
  c.querySelectorAll('.rand-result-card').forEach(card=>{
    const img = card.dataset.img, nm = card.dataset.name;
    if(img) card.addEventListener('click', ()=>openLightbox(img, nm));
  });
}

// ═══════════════════════════════════════════════════════
//  MODE SÉLECTION MULTIPLE
// ═══════════════════════════════════════════════════════
let _selectMode = false;
let _selectedIds = new Set();
let _selectContext = null;

function toggleSelectMode(game, context={}) {
  if(_selectMode) { _exitSelectMode(); return; }
  _selectMode = true;
  _selectedIds = new Set();
  _selectContext = { game, ...context };
  _injectSelectBar();
}
function _exitSelectMode(silent=false) {
  _selectMode = false;
  _selectedIds = new Set();
  _selectContext = null;
  const bar = document.getElementById('select-bar-container');
  if(bar) bar.innerHTML = '';
  document.querySelectorAll('.skin-card.selectable').forEach(c=>{
    c.classList.remove('selectable','selected');
    c.querySelectorAll('.card-actions').forEach(a=>a.style.display='');
  });
  if(!silent) refresh();
}
function _cardClick(el, defaultAction) {
  if(_selectMode) {
    const id = el.dataset.id;
    if(!id) return;
    if(_selectedIds.has(id)) { _selectedIds.delete(id); el.classList.remove('selected'); }
    else { _selectedIds.add(id); el.classList.add('selected'); }
    _updateSelectBar();
  } else {
    if(typeof defaultAction === 'function') defaultAction();
  }
}
function _injectSelectBar() {
  const bar = document.getElementById('select-bar-container');
  if(!bar) return;
  bar.innerHTML = `<div class="select-mode-bar">
    <span style="font-family:'Rajdhani',sans-serif;font-size:1rem;font-weight:700;color:var(--text)" id="select-count">0 sélectionné</span>
    <button class="btn btn-ghost btn-sm" onclick="selectAll()">☑ Tout sélectionner</button>
    <button class="btn btn-danger btn-sm" id="select-delete-btn" disabled style="opacity:.4" onclick="deleteSelected()">🗑 Supprimer la sélection</button>
    <button class="btn btn-ghost btn-sm" onclick="_exitSelectMode()">✕ Annuler</button>
  </div>`;
  document.querySelectorAll('.skin-card[data-id]').forEach(c=>{
    c.classList.add('selectable');
    c.querySelectorAll('.card-actions').forEach(a=>a.style.display='none');
  });
}
function _updateSelectBar() {
  const countEl = document.getElementById('select-count');
  if(countEl) countEl.textContent = `${_selectedIds.size} sélectionné${_selectedIds.size>1?'s':''}`;
  const btn = document.getElementById('select-delete-btn');
  if(btn) { btn.disabled = _selectedIds.size===0; btn.style.opacity = _selectedIds.size===0?'0.4':'1'; }
}
function selectAll() {
  document.querySelectorAll('.skin-card[data-id]').forEach(c=>{ _selectedIds.add(c.dataset.id); c.classList.add('selected'); });
  _updateSelectBar();
}
function deleteSelected() {
  const n = _selectedIds.size;
  if(!n) return;
  if(!confirm(`Supprimer ${n} élément${n>1?'s':''} ?`)) return;
  const db = loadData();
  const cat = _selectContext?.cat || _fnCat;
  if(db.items[cat]) db.items[cat] = db.items[cat].filter(s=>!_selectedIds.has(s.id));
  saveData(db);
  showToast(`${n} élément${n>1?'s':''} supprimé${n>1?'s':''} ✓`);
  _exitSelectMode();
}

window.addEventListener('keydown', e => { if(e.key==='Escape'){ closeModal(); closeLightbox(); } });
navigate('home');
