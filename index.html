<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkinVault – Ma Collection</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&family=Exo+2:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet">
  <style>
/* ============================================================
   style.css – SkinVault — Design premium gaming
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&family=Exo+2:ital,wght@0,300;0,400;0,600;1,300&display=swap');

/* ── Variables ── */
:root {
  --bg:        #07070d;
  --bg2:       #0d0d16;
  --bg3:       #12121e;
  --bg4:       #181828;
  --bg5:       #1e1e30;
  --border:    rgba(255,255,255,0.06);
  --border2:   rgba(255,255,255,0.12);
  --text:      #eeeef8;
  --text-muted:#5a5a72;
  --text-dim:  #9090b0;

  --mythic:    #ffd700;
  --legendary: #ff8c00;
  --epic:      #9b30ff;
  --rare:      #1e90ff;
  --uncommon:  #00c060;
  --common:    #777788;

  --fn-color:    #00d4ff;
  --fn-glow:     rgba(0,212,255,0.18);
  --lol-color:   #c89b3c;
  --lol-glow:    rgba(200,155,60,0.18);
  --tft-color:   #0bc4e3;
  --tft-glow:    rgba(11,196,227,0.18);
  --dbd-color:   #cc2222;
  --dbd-glow:    rgba(204,34,34,0.18);
  --valo-color:  #ff4655;
  --valo-glow:   rgba(255,70,85,0.18);

  --radius:    8px;
  --radius-lg: 14px;
  --radius-xl: 20px;
  --ease:      cubic-bezier(0.4,0,0.2,1);
  --trans:     0.22s var(--ease);
}

/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Exo 2', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── Fond animé subtil ── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 40% at 10% 0%, rgba(0,212,255,0.03) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 90% 100%, rgba(155,48,255,0.04) 0%, transparent 60%);
  pointer-events: none;
  z-index: 0;
}

/* ── Layout ── */
#app { display: flex; min-height: 100vh; position: relative; z-index: 1; }

/* ══════════════════════════════════════
   SIDEBAR
══════════════════════════════════════ */
#sidebar {
  width: 230px;
  min-height: 100vh;
  background: linear-gradient(180deg, var(--bg2) 0%, var(--bg) 100%);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0; left: 0;
  z-index: 100;
  backdrop-filter: blur(20px);
}

/* Logo */
.sidebar-logo {
  padding: 30px 22px 24px;
  border-bottom: 1px solid var(--border);
  position: relative;
  overflow: hidden;
}
.sidebar-logo::after {
  content: '';
  position: absolute;
  bottom: 0; left: 22px; right: 22px;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
}
.sidebar-logo h1 {
  font-family: 'Rajdhani', sans-serif;
  font-size: 1.6rem;
  font-weight: 700;
  letter-spacing: 0.18em;
  background: linear-gradient(135deg, #ffffff 0%, #8888bb 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1;
  margin-bottom: 4px;
}
.sidebar-logo span {
  font-size: 0.6rem;
  letter-spacing: 0.25em;
  color: var(--text-muted);
  text-transform: uppercase;
}

/* Section labels */
.sidebar-section {
  padding: 18px 18px 6px;
  font-size: 0.58rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--text-muted);
  font-weight: 600;
}

.sidebar-nav { padding: 0 10px; }

/* Nav items */
.nav-item {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 11px 13px;
  border-radius: var(--radius);
  cursor: pointer;
  font-family: 'Rajdhani', sans-serif;
  font-size: 0.95rem;
  font-weight: 500;
  letter-spacing: 0.05em;
  color: var(--text-dim);
  transition: var(--trans);
  margin-bottom: 2px;
  border: 1px solid transparent;
  user-select: none;
  position: relative;
  overflow: hidden;
}
.nav-item::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.02));
  opacity: 0;
  transition: opacity var(--trans);
}
.nav-item:hover::before { opacity: 1; }
.nav-item:hover { background: var(--bg3); color: var(--text); }

.nav-item.active {
  background: var(--bg4);
  color: var(--text);
}

/* Dots colorés */
.nav-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
  transition: box-shadow var(--trans);
}
.nav-item[data-game="fortnite"] .nav-dot { background: var(--fn-color); }
.nav-item[data-game="lol"]      .nav-dot { background: var(--lol-color); }
.nav-item[data-game="tft"]      .nav-dot { background: var(--tft-color); }
.nav-item[data-game="dbd"]      .nav-dot { background: var(--dbd-color); }
.nav-item[data-game="valo"]     .nav-dot { background: var(--valo-color); }
.nav-item[data-game="add"]      .nav-dot { background: #444466; }
.nav-item[data-game="home"]     .nav-dot { background: #444466; }

.nav-item.active[data-game="fortnite"] .nav-dot { box-shadow: 0 0 8px var(--fn-color), 0 0 16px var(--fn-color); }
.nav-item.active[data-game="lol"]      .nav-dot { box-shadow: 0 0 8px var(--lol-color), 0 0 16px var(--lol-color); }
.nav-item.active[data-game="tft"]      .nav-dot { box-shadow: 0 0 8px var(--tft-color), 0 0 16px var(--tft-color); }
.nav-item.active[data-game="dbd"]      .nav-dot { box-shadow: 0 0 8px var(--dbd-color), 0 0 16px var(--dbd-color); }
.nav-item.active[data-game="valo"]     .nav-dot { box-shadow: 0 0 8px var(--valo-color), 0 0 16px var(--valo-color); }

/* Active glow border */
.nav-item.active[data-game="fortnite"] { border-color: rgba(0,212,255,0.2);  background: linear-gradient(90deg, rgba(0,212,255,0.06), transparent); }
.nav-item.active[data-game="lol"]      { border-color: rgba(200,155,60,0.2); background: linear-gradient(90deg, rgba(200,155,60,0.06), transparent); }
.nav-item.active[data-game="tft"]      { border-color: rgba(11,196,227,0.2); background: linear-gradient(90deg, rgba(11,196,227,0.06), transparent); }
.nav-item.active[data-game="dbd"]      { border-color: rgba(204,34,34,0.2);  background: linear-gradient(90deg, rgba(204,34,34,0.06), transparent); }
.nav-item.active[data-game="valo"]     { border-color: rgba(255,70,85,0.2);  background: linear-gradient(90deg, rgba(255,70,85,0.06), transparent); }

/* Sidebar bottom */
.sidebar-bottom {
  margin-top: auto;
  padding: 14px 10px;
  border-top: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 6px;
}

/* ══════════════════════════════════════
   MAIN CONTENT
══════════════════════════════════════ */
#main {
  margin-left: 230px;
  flex: 1;
  padding: 36px 40px;
  min-height: 100vh;
}

/* ── Page header ── */
.page-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 32px;
  padding-bottom: 22px;
  border-bottom: 1px solid var(--border);
  position: relative;
}
.page-header::after {
  content: '';
  position: absolute;
  bottom: -1px; left: 0;
  width: 120px; height: 1px;
}
.page-header.fn-page::after   { background: linear-gradient(90deg, var(--fn-color), transparent); }
.page-header.lol-page::after  { background: linear-gradient(90deg, var(--lol-color), transparent); }
.page-header.tft-page::after  { background: linear-gradient(90deg, var(--tft-color), transparent); }
.page-header.dbd-page::after  { background: linear-gradient(90deg, var(--dbd-color), transparent); }
.page-header.valo-page::after { background: linear-gradient(90deg, var(--valo-color), transparent); }

.page-title {
  font-family: 'Rajdhani', sans-serif;
  font-size: 2.2rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  line-height: 1;
}
.fn-accent   { color: var(--fn-color);   text-shadow: 0 0 40px rgba(0,212,255,0.5); }
.lol-accent  { color: var(--lol-color);  text-shadow: 0 0 40px rgba(200,155,60,0.5); }
.tft-accent  { color: var(--tft-color);  text-shadow: 0 0 40px rgba(11,196,227,0.5); }
.dbd-accent  { color: var(--dbd-color);  text-shadow: 0 0 40px rgba(204,34,34,0.5); }
.valo-accent { color: var(--valo-color); text-shadow: 0 0 40px rgba(255,70,85,0.5); }

.count-badge {
  font-size: 0.72rem;
  padding: 5px 12px;
  border-radius: 20px;
  background: var(--bg3);
  border: 1px solid var(--border2);
  color: var(--text-dim);
  font-family: 'Rajdhani', sans-serif;
  letter-spacing: 0.12em;
}

/* ══════════════════════════════════════
   GRILLE & CARDS
══════════════════════════════════════ */
.skins-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(158px, 1fr));
  gap: 16px;
}

/* ── Skin Card ── */
.skin-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.28s var(--ease), box-shadow 0.28s var(--ease), border-color 0.28s var(--ease);
  position: relative;
}
.skin-card:hover {
  transform: translateY(-6px) scale(1.01);
}

/* Glow rareté */
.skin-card[data-rarity="Mythic"]    { border-color: rgba(255,215,0,0.25);  }
.skin-card[data-rarity="Legendary"] { border-color: rgba(255,140,0,0.22);  }
.skin-card[data-rarity="Epic"]      { border-color: rgba(155,48,255,0.25); }
.skin-card[data-rarity="Rare"]      { border-color: rgba(30,144,255,0.22); }
.skin-card[data-rarity="Uncommon"]  { border-color: rgba(0,192,96,0.22);   }
.skin-card[data-rarity="Common"]    { border-color: rgba(119,119,136,0.15);}

.skin-card[data-rarity="Mythic"]:hover    { box-shadow: 0 12px 40px rgba(255,215,0,0.22),  0 0 0 1px rgba(255,215,0,0.4); }
.skin-card[data-rarity="Legendary"]:hover { box-shadow: 0 12px 40px rgba(255,140,0,0.22),  0 0 0 1px rgba(255,140,0,0.4); }
.skin-card[data-rarity="Epic"]:hover      { box-shadow: 0 12px 40px rgba(155,48,255,0.22), 0 0 0 1px rgba(155,48,255,0.4); }
.skin-card[data-rarity="Rare"]:hover      { box-shadow: 0 12px 40px rgba(30,144,255,0.22), 0 0 0 1px rgba(30,144,255,0.4); }
.skin-card[data-rarity="Uncommon"]:hover  { box-shadow: 0 12px 40px rgba(0,192,96,0.22),   0 0 0 1px rgba(0,192,96,0.4); }
.skin-card[data-rarity="Common"]:hover    { box-shadow: 0 8px 24px rgba(0,0,0,0.4); }

/* Image */
.skin-img-wrap {
  aspect-ratio: 3/4;
  overflow: hidden;
  background: linear-gradient(135deg, var(--bg3) 0%, var(--bg4) 100%);
  position: relative;
}
.skin-img-wrap img {
  width: 100%; height: 100%;
  object-fit: cover;
  transition: transform 0.5s var(--ease);
  display: block;
}
.skin-card:hover .skin-img-wrap img { transform: scale(1.08); }
.skin-img-wrap .no-img {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  font-size: 2.8rem;
  color: var(--bg5);
}

/* Dégradé rareté en bas de l'image */
.skin-img-wrap::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 50%;
  background: linear-gradient(0deg, rgba(7,7,13,0.85) 0%, transparent 100%);
  pointer-events: none;
}

/* Barre de rareté */
.rarity-bar {
  height: 2px;
  width: 100%;
  position: relative;
  z-index: 1;
}
.rarity-bar.Mythic    { background: linear-gradient(90deg, var(--mythic), rgba(255,215,0,0.2)); }
.rarity-bar.Legendary { background: linear-gradient(90deg, var(--legendary), rgba(255,140,0,0.2)); }
.rarity-bar.Epic      { background: linear-gradient(90deg, var(--epic), rgba(155,48,255,0.2)); }
.rarity-bar.Rare      { background: linear-gradient(90deg, var(--rare), rgba(30,144,255,0.2)); }
.rarity-bar.Uncommon  { background: linear-gradient(90deg, var(--uncommon), rgba(0,192,96,0.2)); }
.rarity-bar.Common    { background: var(--common); opacity: 0.4; }

/* Infos skin */
.skin-info {
  padding: 11px 13px 13px;
  background: linear-gradient(0deg, var(--bg2) 0%, transparent 100%);
}
.skin-name {
  font-family: 'Rajdhani', sans-serif;
  font-weight: 600;
  font-size: 0.95rem;
  letter-spacing: 0.04em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--text);
}
.skin-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 5px;
  gap: 6px;
}
.skin-rarity-label {
  font-size: 0.65rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-weight: 700;
}
.skin-rarity-label.Mythic    { color: var(--mythic); }
.skin-rarity-label.Legendary { color: var(--legendary); }
.skin-rarity-label.Epic      { color: var(--epic); }
.skin-rarity-label.Rare      { color: var(--rare); }
.skin-rarity-label.Uncommon  { color: var(--uncommon); }
.skin-rarity-label.Common    { color: var(--common); }

.skin-series-badge {
  font-size: 0.58rem;
  padding: 2px 7px;
  border-radius: 4px;
  background: rgba(255,255,255,0.05);
  color: var(--text-muted);
  border: 1px solid var(--border);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 80px;
}

/* Boutons edit/delete */
.card-actions {
  position: absolute;
  top: 8px; right: 8px;
  display: flex;
  gap: 4px;
  opacity: 0;
  transition: opacity var(--trans);
  z-index: 10;
}
.skin-card:hover .card-actions { opacity: 1; }
.card-btn {
  width: 30px; height: 30px;
  border-radius: 7px;
  border: 1px solid rgba(255,255,255,0.1);
  cursor: pointer;
  font-size: 0.75rem;
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(12px);
  transition: var(--trans);
}
.card-btn-edit   { background: rgba(255,255,255,0.12); color: #fff; }
.card-btn-delete { background: rgba(204,34,34,0.35);   color: #ffaaaa; }
.card-btn:hover  { transform: scale(1.12); }

/* ══════════════════════════════════════
   TABS
══════════════════════════════════════ */
.tabs {
  display: flex;
  gap: 3px;
  margin-bottom: 28px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 4px;
  width: fit-content;
}
.tab {
  padding: 8px 22px;
  border-radius: calc(var(--radius) - 2px);
  cursor: pointer;
  font-family: 'Rajdhani', sans-serif;
  font-weight: 600;
  letter-spacing: 0.07em;
  font-size: 0.9rem;
  color: var(--text-muted);
  transition: var(--trans);
  border: none;
  background: none;
}
.tab.active {
  background: var(--bg5);
  color: var(--text);
  box-shadow: 0 1px 8px rgba(0,0,0,0.3);
}
.tab:hover:not(.active) { color: var(--text-dim); }

/* ══════════════════════════════════════
   CHAMPION / ARME SECTIONS
══════════════════════════════════════ */
.champion-section { margin-bottom: 40px; }
.champion-header {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 16px;
  padding: 14px 18px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
}
.champion-avatar {
  width: 50px; height: 50px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid var(--border2);
  flex-shrink: 0;
}
.champion-avatar.no-img {
  background: var(--bg4);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.4rem;
  color: var(--text-muted);
}
.champion-name {
  font-family: 'Rajdhani', sans-serif;
  font-size: 1.15rem;
  font-weight: 700;
  letter-spacing: 0.06em;
}
.champion-skin-count { color: var(--text-muted); font-size: 0.78rem; margin-top: 2px; }

/* Chromas hover */
.chromas-hover {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  background: linear-gradient(0deg, rgba(7,7,13,0.95) 0%, transparent 100%);
  padding: 14px 10px 10px;
  transform: translateY(100%);
  transition: transform 0.3s var(--ease);
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  z-index: 5;
}
.skin-card:hover .chromas-hover { transform: translateY(0); }
.chroma-dot {
  width: 16px; height: 16px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.25);
  cursor: pointer;
  transition: transform var(--trans);
  flex-shrink: 0;
}
.chroma-dot:hover { transform: scale(1.3); }

/* TFT */
.tft-level { display: flex; gap: 2px; margin-top: 4px; }
.tft-star  { color: #ffd700; font-size: 0.72rem; }
.tft-type-badge {
  font-size: 0.62rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--tft-color);
  margin-top: 3px;
  font-weight: 600;
}

/* ══════════════════════════════════════
   MODAL
══════════════════════════════════════ */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  backdrop-filter: blur(8px);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.28s var(--ease);
}
.modal-overlay.open { opacity: 1; pointer-events: all; }

.modal {
  background: var(--bg2);
  border: 1px solid var(--border2);
  border-radius: var(--radius-xl);
  width: 100%;
  max-width: 740px;
  max-height: 90vh;
  overflow-y: auto;
  transform: scale(0.93) translateY(20px);
  transition: transform 0.28s var(--ease);
  box-shadow: 0 30px 80px rgba(0,0,0,0.6);
}
.modal-overlay.open .modal { transform: scale(1) translateY(0); }

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 22px 28px;
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0;
  background: var(--bg2);
  z-index: 2;
  backdrop-filter: blur(20px);
}
.modal-title {
  font-family: 'Rajdhani', sans-serif;
  font-size: 1.5rem;
  font-weight: 700;
  letter-spacing: 0.07em;
}
.modal-close {
  width: 34px; height: 34px;
  border-radius: 8px;
  border: 1px solid var(--border2);
  background: var(--bg3);
  color: var(--text-dim);
  cursor: pointer;
  font-size: 1.1rem;
  transition: var(--trans);
  display: flex; align-items: center; justify-content: center;
}
.modal-close:hover { background: var(--bg5); color: var(--text); }
.modal-body { padding: 28px; }

.modal-main-img {
  width: 100%;
  max-height: 300px;
  object-fit: contain;
  border-radius: var(--radius);
  background: var(--bg3);
  margin-bottom: 22px;
}
.modal-badges {
  display: flex;
  gap: 8px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}
.modal-badge {
  padding: 5px 14px;
  border-radius: 20px;
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.modal-badge.rarity.Mythic    { background: rgba(255,215,0,0.12);  color: var(--mythic);    border: 1px solid rgba(255,215,0,0.35); }
.modal-badge.rarity.Legendary { background: rgba(255,140,0,0.12);  color: var(--legendary); border: 1px solid rgba(255,140,0,0.35); }
.modal-badge.rarity.Epic      { background: rgba(155,48,255,0.12); color: var(--epic);      border: 1px solid rgba(155,48,255,0.35); }
.modal-badge.rarity.Rare      { background: rgba(30,144,255,0.12); color: var(--rare);      border: 1px solid rgba(30,144,255,0.35); }
.modal-badge.rarity.Uncommon  { background: rgba(0,192,96,0.12);   color: var(--uncommon);  border: 1px solid rgba(0,192,96,0.35); }

// ============================================================
//  Fonctions de gestion des données (localStorage + export)
// ============================================================

function loadData() {
  try {
    const raw = localStorage.getItem(DB_KEY);
    if (!raw) return JSON.parse(JSON.stringify(DEFAULT_DATA));
    const saved = JSON.parse(raw);
    // Merge pour garder les nouvelles clés si on met à jour le code
    return deepMergeDefaults(DEFAULT_DATA, saved);
  } catch(e) {
    console.warn('Erreur chargement data, reset:', e);
    return JSON.parse(JSON.stringify(DEFAULT_DATA));
  }
}

function deepMergeDefaults(defaults, saved) {
  const result = JSON.parse(JSON.stringify(saved));
  for (const key of Object.keys(defaults)) {
    if (!(key in result)) result[key] = JSON.parse(JSON.stringify(defaults[key]));
  }
  return result;
}

function saveData(data) {
  localStorage.setItem(DB_KEY, JSON.stringify(data));
}

function exportData() {
  const data = loadData();
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `skinvault_backup_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importData(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = JSON.parse(e.target.result);
        saveData(data);
        resolve(data);
      } catch(err) {
        reject(new Error('Fichier JSON invalide'));
      }
    };
    reader.readAsText(file);
  });
}

function generateId(prefix) {
  return prefix + '_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
}

  const dbdCount  = db.dbd.survivors.reduce((a,c)=>a+c.skins.length,0)
                  + db.dbd.killers.reduce((a,c)=>a+c.skins.length,0);
  const valoCount = db.valo.weapons.reduce((a,w)=>a+w.skins.length,0)
                  + db.valo.buddies.length;
  const total     = fnCount + lolCount + tftCount + dbdCount + valoCount;

      <div class="stat-block">

const FN_VARIANT_LABELS = {

  pickaxe:    "Pioche",
  glider:     "Planeur",
  contrail:   "Traînée",
  guitar:     "Guitare",
  bass:       "Basse",
  keytar:     "Keytar",
  drums:      "Batterie",
  mic:        "Micro",
};

function renderFortnite() {
  const db = loadData();
  const skins = db.fortnite.skins;

  const rarities = ['Mythic','Legendary','Epic','Rare','Uncommon','Common'];

  return `
    <div class="page-header">
      <div class="page-title fn-accent">FORTNITE</div>
      <span class="count-badge">${skins.length} skins</span>
    </div>

    <div class="search-bar">
      <div class="search-input-wrap">

      </div>
    </div>

    <div class="filter-bar" id="fn-rarity-filter">
      <button class="filter-btn active" data-rarity="all" onclick="fnRarityFilter(this,'all')">Tous</button>
      ${rarities.map(r => `
        <button class="filter-btn" data-rarity="${r}" onclick="fnRarityFilter(this,'${r}')"
          style="--c:var(--${r.toLowerCase()})">
          <span style="color:var(--${r.toLowerCase()})">${r}</span>
        </button>
      `).join('')}
    </div>

        ? `<div class="empty-state" style="grid-column:1/-1">
             <div class="icon">⚡</div>
             <p>Aucun skin Fortnite.<br>Ajoute-en depuis la page <strong>Ajouter</strong>.</p>
           </div>`
        : skins.map(s => fnSkinCard(s)).join('')
      }
    </div>
  `;
}

function fnSkinCard(s) {
  const imgSrc = getImage(s.image);
  const hasVariants = s.variants && Object.values(s.variants).some(v => v && v.length > 0);

  return `
    <div class="skin-card" data-rarity="${escHtml(s.rarity)}" data-name="${escHtml(s.name.toLowerCase())}"
         onclick="fnOpenModal('${escHtml(s.id)}')">
      <div class="rarity-bar ${escHtml(s.rarity)}"></div>
      <div class="skin-img-wrap">
        ${imgSrc
          ? `<img src="${imgSrc}" alt="${escHtml(s.name)}" loading="lazy">`
          : `<div class="no-img">⚡</div>`}
      </div>
      <div class="skin-info">
        <div class="skin-name">${escHtml(s.name)}</div>
        <div class="skin-meta">
          <span class="skin-rarity-label ${escHtml(s.rarity)}">${escHtml(s.rarity)}</span>
          ${s.series ? `<span class="skin-series-badge">${escHtml(s.series)}</span>` : ''}
        </div>
        ${hasVariants ? `<div style="font-size:0.65rem;color:var(--text-muted);margin-top:4px">+ variantes</div>` : ''}
      </div>
      <div class="card-actions" onclick="event.stopPropagation()">
        <button class="card-btn card-btn-edit"   onclick="fnEditSkin('${escHtml(s.id)}')">✏</button>
        <button class="card-btn card-btn-delete" onclick="deleteSkin('fortnite','${escHtml(s.id)}')">🗑</button>
      </div>
    </div>
  `;
}

function fnOpenModal(id) {
  const db = loadData();
  const s = db.fortnite.skins.find(x => x.id === id);
  if (!s) return;

  const imgSrc = getImage(s.image);

  let variantsHTML = '';
  if (s.variants) {
    for (const [key, label] of Object.entries(FN_VARIANT_LABELS)) {
      const items = s.variants[key] || [];
      if (items.length === 0) continue;
      variantsHTML += `
        <div class="variant-section">
          <div class="variant-label">${label}</div>
          <div class="variant-grid">
            ${items.map(v => {
              const vsrc = getImage(v.image);
              return `
                <div class="variant-card">
                  ${vsrc
                    ? `<img src="${vsrc}" alt="${escHtml(v.name)}" loading="lazy">`
                    : `<div style="aspect-ratio:1;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:1.5rem">⚡</div>`}
                  <div class="variant-name">${escHtml(v.name)}</div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }
  }

  const body = `
    ${imgSrc ? `<img src="${imgSrc}" alt="${escHtml(s.name)}" class="modal-main-img">` : ''}
    <div class="modal-badges">
      <span class="modal-badge rarity ${escHtml(s.rarity)}">${escHtml(s.rarity)}</span>
      ${s.series ? `<span class="modal-badge series">🏷 ${escHtml(s.series)}</span>` : ''}
    </div>
    ${variantsHTML || `<p style="color:var(--text-muted);font-size:0.85rem">Aucune variante enregistrée.</p>`}
  `;

  openModal(s.name, body);
}

function fnFilter() {
  const q = document.getElementById('fn-search').value.toLowerCase();
  const activeRarity = document.querySelector('#fn-rarity-filter .filter-btn.active')?.dataset.rarity || 'all';
  fnApplyFilter(q, activeRarity);
}

function fnRarityFilter(btn, rarity) {
  document.querySelectorAll('#fn-rarity-filter .filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const q = document.getElementById('fn-search')?.value.toLowerCase() || '';
  fnApplyFilter(q, rarity);
}

function fnApplyFilter(q, rarity) {
  document.querySelectorAll('#fn-grid .skin-card').forEach(card => {
    const name = card.dataset.name || '';
    const r    = card.dataset.rarity || '';
    const matchQ = !q || name.includes(q);
    const matchR = rarity === 'all' || r === rarity;
    card.style.display = (matchQ && matchR) ? '' : 'none';
  });
}

function fnEditSkin(id) {
  navigate('add');
  // Pré-remplissage après init
  setTimeout(() => {
    document.getElementById('add-game-select').value = 'fortnite';
    document.getElementById('add-game-select').dispatchEvent(new Event('change'));
    setTimeout(() => prefillFnSkin(id), 50);
  }, 50);
}

function prefillFnSkin(id) {
  const db = loadData();
  const s = db.fortnite.skins.find(x => x.id === id);
  if (!s) return;

  const nameEl   = document.getElementById('fn-skin-name');
  const rarityEl = document.getElementById('fn-skin-rarity');
  const seriesEl = document.getElementById('fn-skin-series');
  if (nameEl)   nameEl.value   = s.name;
  if (rarityEl) rarityEl.value = s.rarity;
  if (seriesEl) seriesEl.value = s.series || '';

  // Stocker l'id en édition
  const form = document.getElementById('fn-skin-form');
  if (form) form.dataset.editId = id;

  // Variantes
  if (s.variants) {
    for (const key of Object.keys(FN_VARIANT_LABELS)) {
      window[`_fnVariants_${key}`] = JSON.parse(JSON.stringify(s.variants[key] || []));
      renderFnVariantChips(key);
    }
  }

  showToast('Skin chargé pour modification', 'success');
}

          ${char.skins.length === 0
            ? `<p style="color:var(--text-muted); font-size:0.85rem; grid-column:1/-1">Aucun skin.</p>`
            : char.skins.map(s => {
                const ssrc = getImage(s.image);

function valoSwitchTab(tab) {
  _valoTab = tab;
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active',
      (tab==='weapons' && t.textContent==='Armes') ||
      (tab==='buddies' && t.textContent==='Buddies'));
  });
  document.getElementById('valo-tab-content').innerHTML = renderValoTab(tab);
}

function renderValoTab(tab) {
  const db = loadData();

  if (tab === 'buddies') {
    if (db.valo.buddies.length === 0) return `
      <div class="empty-state"><div class="icon">🎯</div><p>Aucun buddy enregistré.</p></div>`;
    return `<div class="skins-grid">${db.valo.buddies.map(b => {
      const src = getImage(b.image);
      return `
        <div class="skin-card" style="cursor:default">
          <div class="rarity-bar" style="background:var(--valo-color);opacity:0.6"></div>
          <div class="skin-img-wrap">
            ${src ? `<img src="${src}" alt="${escHtml(b.name)}" loading="lazy">` : `<div class="no-img">🎯</div>`}
          </div>
          <div class="skin-info"><div class="skin-name">${escHtml(b.name)}</div></div>
          <div class="card-actions" onclick="event.stopPropagation()">
            <button class="card-btn card-btn-delete" onclick="deleteSkin('valo-buddy','${escHtml(b.id)}')">🗑</button>
          </div>
        </div>`;
    }).join('')}</div>`;
  }

  // Weapons tab
  const weapons = db.valo.weapons;
  if (weapons.length === 0) return `
    <div class="empty-state"><div class="icon">🎯</div><p>Aucune arme enregistrée.</p></div>`;

  return weapons.map(w => {
    const imgSrc = getImage(w.image);
    return `
      <div class="champion-section">
        <div class="champion-header">
          ${imgSrc
            ? `<img src="${imgSrc}" alt="${escHtml(w.name)}" class="champion-avatar" style="border-radius:var(--radius)">`
            : `<div class="champion-avatar no-img">🔫</div>`}
          <div>
            <div class="champion-name">${escHtml(w.name)}</div>
            <div class="champion-skin-count">${w.skins.length} skin${w.skins.length!==1?'s':''}</div>
          </div>
          <div style="margin-left:auto; display:flex; gap:6px;">
            <button class="btn btn-danger btn-sm" onclick="deleteSkin('valo-weapon','${escHtml(w.id)}')">🗑 Supprimer</button>
          </div>
        </div>

        <div class="skins-grid">
          ${w.skins.length === 0
            ? `<p style="color:var(--text-muted); font-size:0.85rem; grid-column:1/-1">Aucun skin.</p>`
            : w.skins.map(s => {
                const ssrc = getImage(s.image);
                return `
                  <div class="skin-card" style="cursor:default">
                    <div class="rarity-bar" style="background:var(--valo-color);opacity:0.6"></div>
                    <div class="skin-img-wrap">
                      ${ssrc ? `<img src="${ssrc}" alt="${escHtml(s.name)}" loading="lazy">` : `<div class="no-img">🎯</div>`}
                    </div>
                    <div class="skin-info"><div class="skin-name">${escHtml(s.name)}</div></div>
                    <div class="card-actions" onclick="event.stopPropagation()">
                      <button class="card-btn card-btn-delete" onclick="deleteSkin('valo-weapon-skin','${escHtml(s.id)}',{weaponId:'${escHtml(w.id)}'})">🗑</button>
                    </div>
                  </div>`;
              }).join('')}
        </div>
      </div>
      <hr style="border:none;border-top:1px solid var(--border);margin:24px 0;">
    `;
  }).join('');
}

function addFnVariant(key) {
  const name = document.getElementById(`fn-var-name-${key}`)?.value.trim();
  if (!name) { showToast('Donne un nom à la variante', 'error'); return; }
  const fileInput = document.getElementById(`fn-var-img-${key}`);
  const file = fileInput?.files[0];

  const varId = generateId('fnv');
  storeImage(varId, file).then(() => {
    window[`_fnVariants_${key}`].push({ id: varId, name, image: file ? varId : null });

    document.getElementById(`fn-var-name-${key}`).value = '';
    if (fileInput) fileInput.value = '';

      ${getImage(v.image) ? `<img src="${getImage(v.image)}" alt="">` : ''}

  `).join('');
}

async function saveFnSkin(e) {
  e.preventDefault();
  const form  = document.getElementById('fn-skin-form');
  const name  = document.getElementById('fn-skin-name').value.trim();
  const rar   = document.getElementById('fn-skin-rarity').value;
  const series= document.getElementById('fn-skin-series').value;
  const file  = document.getElementById('fn-skin-img').files[0];
  const editId= form.dataset.editId;

  if (!name || !rar) { showToast('Remplis les champs obligatoires', 'error'); return; }

  const db = loadData();
  let imgId;

  if (editId) {
    const existing = db.fortnite.skins.find(s => s.id === editId);
    imgId = existing?.image || generateId('fnimg');
  } else {
    imgId = generateId('fnimg');
  }

  if (file) await storeImage(imgId, file);
  else if (!editId) imgId = null;

  const variants = {};
  for (const key of FN_VARIANT_KEYS) {
    variants[key] = window[`_fnVariants_${key}`] || [];
  }

  if (editId) {
    const idx = db.fortnite.skins.findIndex(s => s.id === editId);
    if (idx !== -1) {
      db.fortnite.skins[idx] = { ...db.fortnite.skins[idx], name, rarity: rar, series: series||null, image: imgId||db.fortnite.skins[idx].image, variants };
    }
  } else {
    db.fortnite.skins.push({ id: generateId('fn'), name, rarity: rar, series: series||null, image: imgId, variants });
  }

  saveData(db); DB = db;
  showToast(editId ? 'Skin modifié ✓' : 'Skin ajouté ✓');
  resetFnForm();
  delete form.dataset.editId;
}

function resetFnForm() {
  document.getElementById('fn-skin-form')?.reset();
  FN_VARIANT_KEYS.forEach(k => { window[`_fnVariants_${k}`] = []; renderFnVariantChips(k); });
  ['fn-img-preview'].forEach(id => { const el=document.getElementById(id); if(el){el.src='';el.classList.add('hidden');} });
  const form = document.getElementById('fn-skin-form');
  if (form) delete form.dataset.editId;
}

async function saveLolSkin(e) {
  e.preventDefault();
  const form    = document.getElementById('lol-skin-form');
  const name    = document.getElementById('lol-skin-name').value.trim();
  const champId = document.getElementById('lol-skin-champ').value;
  const file    = document.getElementById('lol-skin-img').files[0];
  const editId  = form.dataset.editId;
  const editChampId = form.dataset.editChampId;
  if (!name || !champId) { showToast('Remplis tous les champs', 'error'); return; }

  const db = loadData();
  const champ = db.lol.champions.find(c => c.id === champId);
  if (!champ) { showToast('Champion introuvable', 'error'); return; }

  if (editId) {
    // Peut avoir changé de champion
    const oldChamp = db.lol.champions.find(c => c.id === editChampId);
    const skin = oldChamp?.skins.find(s => s.id === editId);
    if (skin) {
      if (file) await storeImage(skin.image || editId, file);
      skin.name = name;
      skin.chromas = [...window._lolChromas];
      // Si changement de champ
      if (editChampId !== champId) {
        oldChamp.skins = oldChamp.skins.filter(s => s.id !== editId);
        champ.skins.push(skin);
      }
    }
  } else {
    const imgId = generateId('lols');
    if (file) await storeImage(imgId, file);
    champ.skins.push({ id: generateId('lolskin'), name, image: file ? imgId : null, chromas: [...window._lolChromas] });
  }

//  Utilitaire aperçu image
// ═══════════════════════════════════════════════════
function previewImg(previewId, pickerId, input, small = false) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const preview = document.getElementById(previewId);
    if (preview) {
      preview.src = e.target.result;
      preview.classList.remove('hidden');
      if (small) { preview.style.width='40px'; preview.style.height='40px'; }
      else preview.style = '';
    }
    if (pickerId) {
      const label = document.querySelector(`#${pickerId} .img-picker-label`);
      if (label) label.textContent = '✓ Image sélectionnée';
    }
  };
  reader.readAsDataURL(file);
}

let toastTimer;
function showToast(msg, type = 'success') {
  const t = document.getElementById('toast');

  t.className = `show ${type}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = ''; }, 3000);
}

// ── Gestion images ───────────────────────────────────────────
// Les images sont stockées en base64 dans localStorage
// Clé : img_<id>

function storeImage(id, file) {
  return new Promise((resolve) => {
    if (!file) { resolve(null); return; }
    const reader = new FileReader();
    reader.onload = (e) => {
      localStorage.setItem('img_' + id, e.target.result);
      resolve(e.target.result);
    };
    reader.readAsDataURL(file);
  });
}

function getImage(id) {
  if (!id) return null;
  // Si c'est déjà une data URL ou une URL http
  if (id.startsWith('data:') || id.startsWith('http')) return id;
  // Sinon c'est une clé localStorage
  return localStorage.getItem('img_' + id) || null;
}

function deleteImage(id) {
  if (id && !id.startsWith('data:') && !id.startsWith('http')) {
    localStorage.removeItem('img_' + id);
  }
}

// Helper pour afficher une image (retourne du HTML)
function imgTag(id, alt, cls = '') {
  const src = getImage(id);
  if (src) return `<img src="${src}" alt="${escHtml(alt)}" class="${cls}" loading="lazy">`;
  return `<div class="no-img ${cls}">🎮</div>`;
}

// ── Supprimer un skin ────────────────────────────────────────
function deleteSkin(game, id, extra = {}) {
  if (!confirm('Supprimer ce skin ?')) return;
  DB = loadData();

  if (game === 'fortnite') {
    const idx = DB.fortnite.skins.findIndex(s => s.id === id);
    if (idx !== -1) {
      const skin = DB.fortnite.skins[idx];
      deleteImage(skin.image);
      DB.fortnite.skins.splice(idx, 1);
    }
  }
  else if (game === 'lol') {
    const { champId } = extra;
    const champ = DB.lol.champions.find(c => c.id === champId);
    if (champ) {
      const idx = champ.skins.findIndex(s => s.id === id);
      if (idx !== -1) { deleteImage(champ.skins[idx].image); champ.skins.splice(idx, 1); }
    }
  }
  else if (game === 'lol-champ') {
    const idx = DB.lol.champions.findIndex(c => c.id === id);
    if (idx !== -1) {
      const c = DB.lol.champions[idx];
      deleteImage(c.image);
      c.skins.forEach(s => deleteImage(s.image));
      DB.lol.champions.splice(idx, 1);
    }
  }
  else if (game === 'tft') {
    const idx = DB.tft.skins.findIndex(s => s.id === id);
    if (idx !== -1) { deleteImage(DB.tft.skins[idx].image); DB.tft.skins.splice(idx, 1); }
  }
  else if (game === 'dbd-survivor') {
    const idx = DB.dbd.survivors.findIndex(s => s.id === id);
    if (idx !== -1) {
      DB.dbd.survivors[idx].skins.forEach(s => deleteImage(s.image));
      deleteImage(DB.dbd.survivors[idx].image);
      DB.dbd.survivors.splice(idx, 1);
    }
  }
  else if (game === 'dbd-killer') {
    const idx = DB.dbd.killers.findIndex(s => s.id === id);
    if (idx !== -1) {
      DB.dbd.killers[idx].skins.forEach(s => deleteImage(s.image));
      deleteImage(DB.dbd.killers[idx].image);
      DB.dbd.killers.splice(idx, 1);
    }
  }
  else if (game === 'dbd-survivor-skin') {
    const { charId } = extra;
    const char = DB.dbd.survivors.find(c => c.id === charId);
    if (char) { const i = char.skins.findIndex(s=>s.id===id); if(i!==-1){deleteImage(char.skins[i].image);char.skins.splice(i,1);}}
  }
  else if (game === 'dbd-killer-skin') {
    const { charId } = extra;
    const char = DB.dbd.killers.find(c => c.id === charId);
    if (char) { const i = char.skins.findIndex(s=>s.id===id); if(i!==-1){deleteImage(char.skins[i].image);char.skins.splice(i,1);}}
  }
  else if (game === 'valo-weapon') {
    const idx = DB.valo.weapons.findIndex(w => w.id === id);
    if (idx !== -1) {
      DB.valo.weapons[idx].skins.forEach(s => deleteImage(s.image));
      deleteImage(DB.valo.weapons[idx].image);
      DB.valo.weapons.splice(idx, 1);
    }
  }
  else if (game === 'valo-weapon-skin') {
    const { weaponId } = extra;
    const weapon = DB.valo.weapons.find(w => w.id === weaponId);
    if (weapon) { const i = weapon.skins.findIndex(s=>s.id===id); if(i!==-1){deleteImage(weapon.skins[i].image);weapon.skins.splice(i,1);}}
  }
  else if (game === 'valo-buddy') {
    const idx = DB.valo.buddies.findIndex(b => b.id === id);
    if (idx !== -1) { deleteImage(DB.valo.buddies[idx].image); DB.valo.buddies.splice(idx, 1); }
  }

  saveData(DB);
  showToast('Supprimé ✓', 'success');
  refresh();
}

// ── Import ───────────────────────────────────────────────────
async function handleImport(event) {
  const file = event.target.files[0];
  if (!file) return;
  try {
    await importData(file);
    DB = loadData();
    showToast('Import réussi ✓', 'success');
    refresh();
  } catch(e) {
    showToast('Erreur import : ' + e.message, 'error');
  }
  event.target.value = '';
}

// ── Utilitaires HTML ─────────────────────────────────────────
function escHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function rarityColor(r) {
  const map = { Mythic:'--mythic', Legendary:'--legendary', Epic:'--epic', Rare:'--rare', Uncommon:'--uncommon', Common:'--common' };
  return map[r] || '--text-muted';
}

window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

navigate('home');
