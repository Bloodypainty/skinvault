<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkinVault – Ma Collection</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#07070d; --bg2:#0d0d16; --bg3:#12121e; --bg4:#181828; --bg5:#1e1e30;
  --border:rgba(255,255,255,0.06); --border2:rgba(255,255,255,0.12);
  --text:#eeeef8; --text-muted:#5a5a72; --text-dim:#9090b0;
  --mythic:#ffd700; --legendary:#ff8c00; --epic:#9b30ff; --rare:#1e90ff; --uncommon:#00c060; --common:#777788;
  --fn:#00d4ff; --lol:#c89b3c; --tft:#0bc4e3; --dbd:#cc2222; --valo:#ff4655;
  --r:8px; --rl:14px; --rx:20px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Exo 2',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 40% at 10% 0%,rgba(0,212,255,0.03),transparent 60%),radial-gradient(ellipse 60% 40% at 90% 100%,rgba(155,48,255,0.04),transparent 60%);pointer-events:none;z-index:0}
#app{display:flex;min-height:100vh;position:relative;z-index:1}

/* SIDEBAR */
#sidebar{width:230px;min-height:100vh;background:linear-gradient(180deg,var(--bg2),var(--bg));border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;z-index:100}
.sidebar-logo{padding:28px 22px 22px;border-bottom:1px solid var(--border)}
.sidebar-logo h1{font-family:'Rajdhani',sans-serif;font-size:1.6rem;font-weight:700;letter-spacing:.18em;background:linear-gradient(135deg,#fff,#8888bb);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sidebar-logo span{font-size:.6rem;letter-spacing:.25em;color:var(--text-muted);text-transform:uppercase}
.sidebar-section{padding:16px 18px 5px;font-size:.58rem;letter-spacing:.22em;text-transform:uppercase;color:var(--text-muted);font-weight:600}
.sidebar-nav{padding:0 10px}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:var(--r);cursor:pointer;font-family:'Rajdhani',sans-serif;font-size:.95rem;font-weight:500;letter-spacing:.05em;color:var(--text-dim);transition:.22s;margin-bottom:2px;border:1px solid transparent;user-select:none}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{color:var(--text)}
.nav-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;transition:.22s}
.nav-item[data-game=fortnite] .nav-dot{background:var(--fn)}
.nav-item[data-game=lol] .nav-dot{background:var(--lol)}
.nav-item[data-game=tft] .nav-dot{background:var(--tft)}
.nav-item[data-game=dbd] .nav-dot{background:var(--dbd)}
.nav-item[data-game=valo] .nav-dot{background:var(--valo)}
.nav-item[data-game=random] .nav-dot{background:linear-gradient(135deg,var(--fn),var(--valo))}
.nav-item[data-game=add] .nav-dot,.nav-item[data-game=home] .nav-dot{background:#444466}
.nav-item.active[data-game=fortnite]{border-color:rgba(0,212,255,.2);background:linear-gradient(90deg,rgba(0,212,255,.07),transparent)}
.nav-item.active[data-game=lol]{border-color:rgba(200,155,60,.2);background:linear-gradient(90deg,rgba(200,155,60,.07),transparent)}
.nav-item.active[data-game=tft]{border-color:rgba(11,196,227,.2);background:linear-gradient(90deg,rgba(11,196,227,.07),transparent)}
.nav-item.active[data-game=dbd]{border-color:rgba(204,34,34,.2);background:linear-gradient(90deg,rgba(204,34,34,.07),transparent)}
.nav-item.active[data-game=valo]{border-color:rgba(255,70,85,.2);background:linear-gradient(90deg,rgba(255,70,85,.07),transparent)}
.nav-item.active[data-game=random]{border-color:rgba(155,48,255,.3);background:linear-gradient(90deg,rgba(155,48,255,.08),transparent)}
.nav-item.active[data-game=fortnite] .nav-dot{box-shadow:0 0 10px var(--fn)}
.nav-item.active[data-game=lol] .nav-dot{box-shadow:0 0 10px var(--lol)}
.nav-item.active[data-game=tft] .nav-dot{box-shadow:0 0 10px var(--tft)}
.nav-item.active[data-game=dbd] .nav-dot{box-shadow:0 0 10px var(--dbd)}
.nav-item.active[data-game=valo] .nav-dot{box-shadow:0 0 10px var(--valo)}
.sidebar-bottom{margin-top:auto;padding:14px 10px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px}

/* MAIN */
#main{margin-left:230px;flex:1;padding:36px 40px;min-height:100vh}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid var(--border);position:relative}
.page-header::after{content:'';position:absolute;bottom:-1px;left:0;width:120px;height:1px}
.page-header.fn-page::after{background:linear-gradient(90deg,var(--fn),transparent)}
.page-header.lol-page::after{background:linear-gradient(90deg,var(--lol),transparent)}
.page-header.tft-page::after{background:linear-gradient(90deg,var(--tft),transparent)}
.page-header.dbd-page::after{background:linear-gradient(90deg,var(--dbd),transparent)}
.page-header.valo-page::after{background:linear-gradient(90deg,var(--valo),transparent)}
.page-title{font-family:'Rajdhani',sans-serif;font-size:2.2rem;font-weight:700;letter-spacing:.1em;line-height:1}
.fn-accent{color:var(--fn);text-shadow:0 0 40px rgba(0,212,255,.5)}
.lol-accent{color:var(--lol);text-shadow:0 0 40px rgba(200,155,60,.5)}
.tft-accent{color:var(--tft);text-shadow:0 0 40px rgba(11,196,227,.5)}
.dbd-accent{color:var(--dbd);text-shadow:0 0 40px rgba(204,34,34,.5)}
.valo-accent{color:var(--valo);text-shadow:0 0 40px rgba(255,70,85,.5)}
.count-badge{font-size:.72rem;padding:5px 12px;border-radius:20px;background:var(--bg3);border:1px solid var(--border2);color:var(--text-dim);font-family:'Rajdhani',sans-serif;letter-spacing:.12em}

/* GRID & CARDS */
.skins-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:14px}
.skin-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;cursor:pointer;transition:transform .28s,box-shadow .28s,border-color .28s;position:relative}
.skin-card:hover{transform:translateY(-6px) scale(1.01)}
.skin-card[data-rarity=Mythic]{border-color:rgba(255,215,0,.25)}
.skin-card[data-rarity=Legendary]{border-color:rgba(255,140,0,.22)}
.skin-card[data-rarity=Epic]{border-color:rgba(155,48,255,.25)}
.skin-card[data-rarity=Rare]{border-color:rgba(30,144,255,.22)}
.skin-card[data-rarity=Uncommon]{border-color:rgba(0,192,96,.22)}
.skin-card[data-rarity=Mythic]:hover{box-shadow:0 12px 40px rgba(255,215,0,.22),0 0 0 1px rgba(255,215,0,.4)}
.skin-card[data-rarity=Legendary]:hover{box-shadow:0 12px 40px rgba(255,140,0,.22),0 0 0 1px rgba(255,140,0,.4)}
.skin-card[data-rarity=Epic]:hover{box-shadow:0 12px 40px rgba(155,48,255,.22),0 0 0 1px rgba(155,48,255,.4)}
.skin-card[data-rarity=Rare]:hover{box-shadow:0 12px 40px rgba(30,144,255,.22),0 0 0 1px rgba(30,144,255,.4)}
.skin-card[data-rarity=Uncommon]:hover{box-shadow:0 12px 40px rgba(0,192,96,.22),0 0 0 1px rgba(0,192,96,.4)}
.skin-img-wrap{aspect-ratio:3/4;overflow:hidden;background:linear-gradient(135deg,var(--bg3),var(--bg4));position:relative}
.skin-img-wrap img{width:100%;height:100%;object-fit:cover;transition:transform .5s;display:block}
.skin-card:hover .skin-img-wrap img{transform:scale(1.08)}
.skin-img-wrap .no-img{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:2.5rem;color:var(--bg5)}
.skin-img-wrap::after{content:'';position:absolute;bottom:0;left:0;right:0;height:50%;background:linear-gradient(0deg,rgba(7,7,13,.85),transparent);pointer-events:none}
.rarity-bar{height:2px;width:100%}
.rarity-bar.Mythic{background:linear-gradient(90deg,var(--mythic),rgba(255,215,0,.2))}
.rarity-bar.Legendary{background:linear-gradient(90deg,var(--legendary),rgba(255,140,0,.2))}
.rarity-bar.Epic{background:linear-gradient(90deg,var(--epic),rgba(155,48,255,.2))}
.rarity-bar.Rare{background:linear-gradient(90deg,var(--rare),rgba(30,144,255,.2))}
.rarity-bar.Uncommon{background:linear-gradient(90deg,var(--uncommon),rgba(0,192,96,.2))}
.rarity-bar.Common{background:var(--common);opacity:.4}
.skin-info{padding:10px 12px 12px}
.skin-name{font-family:'Rajdhani',sans-serif;font-weight:600;font-size:.93rem;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.skin-meta{display:flex;align-items:center;justify-content:space-between;margin-top:4px;gap:5px}
.skin-rarity-label{font-size:.63rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.skin-rarity-label.Mythic{color:var(--mythic)}.skin-rarity-label.Legendary{color:var(--legendary)}.skin-rarity-label.Epic{color:var(--epic)}.skin-rarity-label.Rare{color:var(--rare)}.skin-rarity-label.Uncommon{color:var(--uncommon)}.skin-rarity-label.Common{color:var(--common)}
.skin-series-badge{font-size:.58rem;padding:2px 6px;border-radius:4px;background:rgba(255,255,255,.05);color:var(--text-muted);border:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80px}
.card-actions{position:absolute;top:8px;right:8px;display:flex;gap:4px;opacity:0;transition:.22s;z-index:10}
.skin-card:hover .card-actions{opacity:1}
.card-btn{width:30px;height:30px;border-radius:7px;border:1px solid rgba(255,255,255,.1);cursor:pointer;font-size:.75rem;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(12px);transition:.22s}
.card-btn-edit{background:rgba(255,255,255,.12);color:#fff}
.card-btn-delete{background:rgba(204,34,34,.35);color:#ffaaaa}
.card-btn:hover{transform:scale(1.12)}

/* TABS */
.tabs{display:flex;gap:3px;margin-bottom:24px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:4px;width:fit-content}
.tab{padding:8px 22px;border-radius:calc(var(--r) - 2px);cursor:pointer;font-family:'Rajdhani',sans-serif;font-weight:600;letter-spacing:.07em;font-size:.9rem;color:var(--text-muted);transition:.22s;border:none;background:none}
.tab.active{background:var(--bg5);color:var(--text);box-shadow:0 1px 8px rgba(0,0,0,.3)}
.tab:hover:not(.active){color:var(--text-dim)}

/* CHAMPION SECTIONS */
.champion-section{margin-bottom:36px}
.champion-header{display:flex;align-items:center;gap:14px;margin-bottom:14px;padding:14px 18px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl)}
.champion-avatar{width:50px;height:50px;border-radius:50%;object-fit:cover;border:2px solid var(--border2);flex-shrink:0}
.champion-avatar.no-img{background:var(--bg4);display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:var(--text-muted)}
.champion-name{font-family:'Rajdhani',sans-serif;font-size:1.1rem;font-weight:700;letter-spacing:.06em}
.champion-skin-count{color:var(--text-muted);font-size:.76rem;margin-top:2px}
.role-badge{font-size:.6rem;padding:2px 8px;border-radius:10px;background:rgba(200,155,60,.1);border:1px solid rgba(200,155,60,.25);color:var(--lol);text-transform:uppercase;letter-spacing:.1em;font-weight:600;margin-top:3px;display:inline-block}

/* Chromas */
.chromas-hover{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(0deg,rgba(7,7,13,.95),transparent);padding:14px 10px 10px;transform:translateY(100%);transition:transform .3s;display:flex;gap:5px;flex-wrap:wrap;z-index:5}
.skin-card:hover .chromas-hover{transform:translateY(0)}
.chroma-dot{width:15px;height:15px;border-radius:50%;border:2px solid rgba(255,255,255,.25);cursor:pointer;transition:.22s;flex-shrink:0}
.chroma-dot:hover{transform:scale(1.3)}

/* TFT */
.tft-level{display:flex;gap:2px;margin-top:3px}
.tft-star{color:#ffd700;font-size:.7rem}
.tft-type-badge{font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;color:var(--tft);margin-top:3px;font-weight:600}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.86);backdrop-filter:blur(10px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .28s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--rx);width:100%;max-width:620px;max-height:92vh;overflow-y:auto;transform:scale(.93) translateY(20px);transition:transform .28s;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal-overlay.open .modal{transform:scale(1) translateY(0)}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:22px 28px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg2);z-index:2}
.modal-title{font-family:'Rajdhani',sans-serif;font-size:1.5rem;font-weight:700;letter-spacing:.07em}
.modal-close{width:34px;height:34px;border-radius:8px;border:1px solid var(--border2);background:var(--bg3);color:var(--text-dim);cursor:pointer;font-size:1.1rem;transition:.22s;display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:var(--bg5);color:var(--text)}
.modal-body{padding:22px}.modal-body img{max-width:100%}
.modal-main-img{width:100%;max-height:300px;object-fit:contain;border-radius:var(--r);background:var(--bg3);margin-bottom:22px}
.modal-badges{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}
.modal-badge{padding:5px 14px;border-radius:20px;font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.modal-badge.rarity.Mythic{background:rgba(255,215,0,.12);color:var(--mythic);border:1px solid rgba(255,215,0,.35)}
.modal-badge.rarity.Legendary{background:rgba(255,140,0,.12);color:var(--legendary);border:1px solid rgba(255,140,0,.35)}
.modal-badge.rarity.Epic{background:rgba(155,48,255,.12);color:var(--epic);border:1px solid rgba(155,48,255,.35)}
.modal-badge.rarity.Rare{background:rgba(30,144,255,.12);color:var(--rare);border:1px solid rgba(30,144,255,.35)}
.modal-badge.rarity.Uncommon{background:rgba(0,192,96,.12);color:var(--uncommon);border:1px solid rgba(0,192,96,.35)}
.modal-badge.rarity.Common{background:rgba(119,119,136,.1);color:var(--common);border:1px solid rgba(119,119,136,.2)}
.modal-badge.series{background:rgba(255,255,255,.05);color:var(--text-dim);border:1px solid var(--border2)}
.variant-section-modal{margin-bottom:22px}
.variant-label{font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--text-muted);margin-bottom:10px;font-weight:600}
.variant-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
.variant-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;text-align:center;transition:.22s}
.variant-card:hover{border-color:var(--border2);transform:translateY(-2px)}
.variant-card img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.variant-card .vname{font-size:.66rem;padding:5px 4px;color:var(--text-dim)}

/* FORMS */
.form-section{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);padding:24px 26px;margin-bottom:18px}
.form-section-title{font-family:'Rajdhani',sans-serif;font-size:1.05rem;font-weight:700;letter-spacing:.07em;margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.form-row.single{grid-template-columns:1fr}
.form-row.triple{grid-template-columns:1fr 1fr 1fr}
.form-group{display:flex;flex-direction:column;gap:6px}
label{font-size:.67rem;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);font-weight:600}
input[type=text],input[type=number],input[type=url],select,textarea{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r);padding:10px 13px;color:var(--text);font-family:'Exo 2',sans-serif;font-size:.9rem;outline:none;transition:.22s;width:100%}
input:focus,select:focus,textarea:focus{border-color:rgba(255,255,255,.3);box-shadow:0 0 0 3px rgba(255,255,255,.04)}
select option{background:var(--bg3)}

/* Image URL preview */
.img-url-wrap{display:flex;flex-direction:column;gap:8px}
.img-url-preview{width:100%;height:140px;object-fit:contain;border-radius:var(--r);background:var(--bg3);border:1px solid var(--border);display:none}
.img-url-preview.show{display:block}

/* Roles checkboxes */
.roles-wrap{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.role-check{display:flex;align-items:center;gap:5px;cursor:pointer;font-size:.82rem;color:var(--text-dim);transition:.22s}
.role-check input{display:none}
.role-pill{padding:5px 13px;border-radius:20px;border:1px solid var(--border2);background:var(--bg3);font-family:'Rajdhani',sans-serif;font-weight:600;font-size:.8rem;letter-spacing:.07em;transition:.22s;cursor:pointer}
.role-check input:checked+.role-pill{background:rgba(200,155,60,.15);border-color:rgba(200,155,60,.5);color:var(--lol)}

/* Chips */
.variant-list-preview{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.variant-chip{display:flex;align-items:center;gap:6px;background:var(--bg4);border:1px solid var(--border2);border-radius:20px;padding:4px 10px;font-size:.77rem;color:var(--text-dim)}
.variant-chip img{width:20px;height:20px;object-fit:cover;border-radius:50%}
.variant-chip-remove{border:none;background:none;color:var(--text-muted);cursor:pointer;font-size:.9rem;padding:0 2px;transition:.22s;line-height:1}
.variant-chip-remove:hover{color:#ff5555}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 22px;border-radius:var(--r);border:none;cursor:pointer;font-family:'Rajdhani',sans-serif;font-weight:600;font-size:.95rem;letter-spacing:.07em;transition:.22s;white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.18);color:#fff}
.btn-primary:hover{background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.1));box-shadow:0 4px 16px rgba(0,0,0,.3)}
.btn-danger{background:rgba(204,34,34,.18);border:1px solid rgba(204,34,34,.35);color:#ff7777}
.btn-danger:hover{background:rgba(204,34,34,.3)}
.btn-sm{padding:7px 14px;font-size:.82rem}
.btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--text-muted)}
.btn-ghost:hover{background:var(--bg3);color:var(--text)}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:20px}

/* SEARCH & FILTER */
.search-bar{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.search-input-wrap{position:relative;flex:1;max-width:340px}
.search-input-wrap input{padding-left:36px}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:.9rem;pointer-events:none}
.filter-bar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:20px}
.filter-btn{padding:5px 13px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text-muted);font-size:.72rem;cursor:pointer;transition:.22s;font-family:'Exo 2',sans-serif}
.filter-btn:hover{background:var(--bg3);color:var(--text-dim);border-color:var(--border2)}
.filter-btn.active{background:var(--bg4);color:var(--text);border-color:var(--border2)}

/* TOAST */
#toast{position:fixed;bottom:28px;right:28px;background:var(--bg4);border:1px solid var(--border2);border-radius:var(--r);padding:13px 20px;font-size:.88rem;color:var(--text);z-index:9999;transform:translateY(80px);opacity:0;transition:all .3s;max-width:300px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
#toast.show{transform:translateY(0);opacity:1}
#toast.success{border-color:rgba(0,192,96,.4)}
#toast.error{border-color:rgba(204,34,34,.4)}

/* EMPTY */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:70px 20px;text-align:center;color:var(--text-muted);gap:14px;grid-column:1/-1}
.empty-state .icon{font-size:3.5rem;opacity:.5}
.empty-state p{font-size:.9rem;line-height:1.6}

/* HOME */
.home-stats{display:flex;gap:16px;margin-bottom:28px;flex-wrap:wrap}
.stat-block{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);padding:18px 22px;flex:1;min-width:110px}
.stat-number{font-family:'Rajdhani',sans-serif;font-size:2.2rem;font-weight:700;line-height:1}
.stat-label{font-size:.68rem;color:var(--text-muted);letter-spacing:.12em;text-transform:uppercase;margin-top:4px}
.home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.game-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rx);padding:26px 22px;cursor:pointer;transition:transform .28s,box-shadow .28s,border-color .28s;display:flex;flex-direction:column;gap:9px;position:relative;overflow:hidden}
.game-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px}
.game-card:hover{transform:translateY(-5px)}
.game-card.fn{border-color:rgba(0,212,255,.18)}.game-card.fn::before{background:linear-gradient(90deg,transparent,var(--fn),transparent);opacity:.4}
.game-card.lol{border-color:rgba(200,155,60,.18)}.game-card.lol::before{background:linear-gradient(90deg,transparent,var(--lol),transparent);opacity:.4}
.game-card.tft{border-color:rgba(11,196,227,.18)}.game-card.tft::before{background:linear-gradient(90deg,transparent,var(--tft),transparent);opacity:.4}
.game-card.dbd{border-color:rgba(204,34,34,.18)}.game-card.dbd::before{background:linear-gradient(90deg,transparent,var(--dbd),transparent);opacity:.4}
.game-card.valo{border-color:rgba(255,70,85,.18)}.game-card.valo::before{background:linear-gradient(90deg,transparent,var(--valo),transparent);opacity:.4}
.game-card.rand{border-color:rgba(155,48,255,.25);background:linear-gradient(135deg,rgba(155,48,255,.05),rgba(0,212,255,.05))}.game-card.rand::before{background:linear-gradient(90deg,transparent,var(--epic),transparent);opacity:.5}
.game-card:hover.fn{box-shadow:0 10px 40px rgba(0,212,255,.15);border-color:rgba(0,212,255,.35)}
.game-card:hover.lol{box-shadow:0 10px 40px rgba(200,155,60,.15);border-color:rgba(200,155,60,.35)}
.game-card:hover.tft{box-shadow:0 10px 40px rgba(11,196,227,.15);border-color:rgba(11,196,227,.35)}
.game-card:hover.dbd{box-shadow:0 10px 40px rgba(204,34,34,.15);border-color:rgba(204,34,34,.35)}
.game-card:hover.valo{box-shadow:0 10px 40px rgba(255,70,85,.15);border-color:rgba(255,70,85,.35)}
.game-card:hover.rand{box-shadow:0 10px 40px rgba(155,48,255,.2);border-color:rgba(155,48,255,.45)}
.game-card-icon{font-size:2.2rem}
.game-card-name{font-family:'Rajdhani',sans-serif;font-size:1.3rem;font-weight:700;letter-spacing:.08em}
.game-card.fn .game-card-name{color:var(--fn)}.game-card.lol .game-card-name{color:var(--lol)}.game-card.tft .game-card-name{color:var(--tft)}.game-card.dbd .game-card-name{color:var(--dbd)}.game-card.valo .game-card-name{color:var(--valo)}.game-card.rand .game-card-name{background:linear-gradient(135deg,var(--epic),var(--fn));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.game-card-count{font-size:.78rem;color:var(--text-muted)}

/* ═══════════════ RANDOMIZER ═══════════════ */
.rand-page{max-width:1100px}
.rand-tabs{display:flex;gap:3px;margin-bottom:28px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:4px;width:fit-content}
.rand-tab{padding:9px 24px;border-radius:calc(var(--r) - 2px);cursor:pointer;font-family:'Rajdhani',sans-serif;font-weight:600;letter-spacing:.07em;font-size:.95rem;color:var(--text-muted);transition:.22s;border:none;background:none}
.rand-tab.active{background:var(--bg5);color:var(--text);box-shadow:0 1px 8px rgba(0,0,0,.3)}

/* Sélection des catégories FN */
.fn-cats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:24px}
.fn-cat-check{cursor:pointer}
.fn-cat-check input{display:none}
.fn-cat-pill{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:var(--r);border:1px solid var(--border2);background:var(--bg3);font-family:'Rajdhani',sans-serif;font-weight:600;font-size:.85rem;letter-spacing:.05em;color:var(--text-dim);transition:.22s;cursor:pointer}
.fn-cat-check input:checked+.fn-cat-pill{background:rgba(0,212,255,.1);border-color:rgba(0,212,255,.4);color:var(--fn)}
.fn-cat-pill .cat-icon{font-size:1.1rem}

/* Résultats randomizer */
.rand-results{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;margin-top:28px}
.rand-result-card{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--rx);overflow:hidden;position:relative;transition:.28s}
.rand-result-card:hover{transform:translateY(-4px)}
.rand-result-img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:var(--bg3)}
.rand-result-img.landscape{aspect-ratio:16/9}
.rand-result-img.no-img-big{width:100%;aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;font-size:4rem;background:linear-gradient(135deg,var(--bg3),var(--bg4))}
.rand-result-info{padding:14px 16px 16px;background:linear-gradient(0deg,var(--bg2),transparent)}
.rand-result-cat{font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--text-muted);font-weight:600;margin-bottom:4px}
.rand-result-name{font-family:'Rajdhani',sans-serif;font-size:1.15rem;font-weight:700;letter-spacing:.05em}
.rand-result-sub{font-size:.75rem;color:var(--text-dim);margin-top:3px}
.rand-result-card[data-rarity=Mythic]{border-color:rgba(255,215,0,.3);box-shadow:0 0 20px rgba(255,215,0,.08)}
.rand-result-card[data-rarity=Legendary]{border-color:rgba(255,140,0,.3);box-shadow:0 0 20px rgba(255,140,0,.08)}
.rand-result-card[data-rarity=Epic]{border-color:rgba(155,48,255,.3);box-shadow:0 0 20px rgba(155,48,255,.08)}
.rand-result-card[data-rarity=Rare]{border-color:rgba(30,144,255,.3);box-shadow:0 0 20px rgba(30,144,255,.08)}

.rand-btn{font-size:1.1rem;padding:14px 36px;border-radius:var(--rl);background:linear-gradient(135deg,rgba(155,48,255,.2),rgba(0,212,255,.15));border:1px solid rgba(155,48,255,.4);color:#fff;font-family:'Rajdhani',sans-serif;font-weight:700;letter-spacing:.1em;cursor:pointer;transition:.28s;display:flex;align-items:center;gap:10px}
.rand-btn:hover{background:linear-gradient(135deg,rgba(155,48,255,.35),rgba(0,212,255,.25));box-shadow:0 8px 30px rgba(155,48,255,.25);transform:translateY(-2px)}
.rand-btn.spinning{animation:spinBounce .6s ease}
@keyframes spinBounce{0%{transform:scale(.95)}50%{transform:scale(1.05)}100%{transform:scale(1)}}

/* LOL Randomizer steps */
.lol-rand-step{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);padding:20px 24px;margin-bottom:16px}
.lol-rand-step-title{font-family:'Rajdhani',sans-serif;font-size:1rem;font-weight:700;letter-spacing:.08em;color:var(--text-dim);margin-bottom:14px;display:flex;align-items:center;gap:10px}
.step-num{width:26px;height:26px;border-radius:50%;background:var(--bg5);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:.8rem;color:var(--text-muted);font-family:'Rajdhani',sans-serif;font-weight:700;flex-shrink:0}
.lol-roles-grid{display:flex;flex-wrap:wrap;gap:8px}
.lol-role-btn{padding:8px 18px;border-radius:20px;border:1px solid var(--border2);background:var(--bg3);font-family:'Rajdhani',sans-serif;font-weight:600;font-size:.85rem;letter-spacing:.07em;color:var(--text-dim);cursor:pointer;transition:.22s}
.lol-role-btn.selected{background:rgba(200,155,60,.15);border-color:rgba(200,155,60,.5);color:var(--lol)}
.lol-champ-select-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-top:10px}
.lol-champ-btn{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:10px 8px;text-align:center;cursor:pointer;transition:.22s;font-family:'Rajdhani',sans-serif;font-size:.82rem;font-weight:600;color:var(--text-dim)}
.lol-champ-btn img{width:44px;height:44px;border-radius:50%;object-fit:cover;margin:0 auto 6px;display:block;border:2px solid var(--border2)}
.lol-champ-btn:hover{border-color:var(--border2);color:var(--text)}
.lol-champ-btn.selected{border-color:rgba(200,155,60,.5);background:rgba(200,155,60,.08);color:var(--lol)}
.lol-rand-result-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;margin-top:20px}

/* Scrollbar */
::-webkit-scrollbar{width:5px;height:5px}

<!-- Lightbox -->

<script>
function openLightbox(src, name) {
  if(!src) return;
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox-name').textContent = name || '';
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
}

// ═══════════════════════════════════════════════════════
//  DATA
// ═══════════════════════════════════════════════════════
const DB_KEY = 'skinvault_data';
const LOL_ROLES = ['Top','Jungle','Mid','ADC','Support'];
const FN_CATS = {
  skin:       {label:'Skin',             icon:'👤'},
  back_bling: {label:'Accessoire de dos',icon:'🎒'},
  pickaxe:    {label:'Pioche',           icon:'⛏️'},
  glider:     {label:'Planeur',          icon:'🪂'},
  contrail:   {label:'Traînée',          icon:'✨'},
  shoes:      {label:'Chaussures',       icon:'👟'},
  aura:       {label:'Aura',             icon:'🌟'},
  guitar:     {label:'Guitare',          icon:'🎸'},
  bass:       {label:'Basse',            icon:'🎵'},
  keytar:     {label:'Keytar',           icon:'🎹'},
  drums:      {label:'Batterie',         icon:'🥁'},
  mic:        {label:'Micro',            icon:'🎤'},
};

const DEFAULT_DATA = {
  fortnite: {
    series: ["Icon Series","Marvel Series","DC Series","Gaming Legends","Star Wars","Lego","Collab"],
    items: {} // { skin: [], back_bling: [], pickaxe: [], ... }
  },
  lol:  { champions: [] },
  tft:  { skins: [] },
  dbd:  { survivors: [], killers: [] },
  valo: { weapons: [], buddies: [] }
};

function loadData() {
  try {
    const raw = localStorage.getItem(DB_KEY);
    if (!raw) return JSON.parse(JSON.stringify(DEFAULT_DATA));
    const saved = JSON.parse(raw);
    if (!saved.fortnite.items) saved.fortnite.items = {};
    return saved;
  } catch(e) { return JSON.parse(JSON.stringify(DEFAULT_DATA)); }
}
function saveData(d) { localStorage.setItem(DB_KEY, JSON.stringify(d)); }
function generateId(p) { return p+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,7); }

function exportData() {
  const d = loadData();
  const blob = new Blob([JSON.stringify(d,null,2)],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url;
  a.download=`skinvault_${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(url);
}
function importData(file) {
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = e => { try { const d=JSON.parse(e.target.result); saveData(d); res(d); } catch(err){rej(new Error('JSON invalide'));} };
    r.readAsText(file);
  });
}
async function handleImport(e) {
  const f=e.target.files[0]; if(!f) return;
  try { await importData(f); showToast('Import réussi ✓'); refresh(); }
  catch(err) { showToast('Erreur : '+err.message,'error'); }
  e.target.value='';
}

// ═══════════════════════════════════════════════════════
//  APP
// ═══════════════════════════════════════════════════════
let currentPage = 'home';
let DB = loadData();

function navigate(page) {
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active', el.dataset.game===page));
  const c = document.getElementById('page-content');
  switch(page) {
    case 'home':    c.innerHTML = renderHome(); break;
    case 'fortnite':c.innerHTML = renderFN();   break;
    case 'lol':     c.innerHTML = renderLoL();  break;
    case 'tft':     c.innerHTML = renderTFT();  break;
    case 'dbd':     c.innerHTML = renderDBD();  break;
    case 'valo':    c.innerHTML = renderValo(); break;
    case 'random':  c.innerHTML = renderRandom(); initRandom(); break;
    case 'add':     c.innerHTML = renderAdd(); break;
    default: c.innerHTML='<p>404</p>';
  }
}
function refresh() { DB=loadData(); navigate(currentPage); }

// Modal
function openModal(title, body) {
  document.getElementById('modal-title').textContent=title;
  document.getElementById('modal-body').innerHTML=body;
  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); document.body.style.overflow=''; }
function closeModalOnBg(e) { if(e.target===document.getElementById('modal-overlay')) closeModal(); }

// Toast
let _tt;
function showToast(msg,type='success') {
  const t=document.getElementById('toast');
  t.textContent=msg; t.className=`show ${type}`;
  clearTimeout(_tt); _tt=setTimeout(()=>{t.className='';},3000);
}

// Utils
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function imgHtml(url, cls='', alt='') {
  if(url) return `<img src="${esc(url)}" alt="${esc(alt)}" class="${cls}" loading="lazy" onerror="this.style.display='none'">`;
  return `<div class="no-img ${cls}">🎮</div>`;
}
function rand(arr) { return arr[Math.floor(Math.random()*arr.length)]; }
function previewUrl(inputId, previewId) {
  const url = document.getElementById(inputId)?.value.trim();
  const img = document.getElementById(previewId);
  if(!img) return;
  if(url) { img.src=url; img.classList.add('show'); }
  else { img.classList.remove('show'); }
}

// Delete
function deleteSkin(game, id, extra={}) {
  if(!confirm('Supprimer ?')) return;
  DB = loadData();
  if(game==='fn') {
    const {cat} = extra;
    if(DB.fortnite.items[cat]) DB.fortnite.items[cat] = DB.fortnite.items[cat].filter(x=>x.id!==id);
  }
  else if(game==='lol-skin') {
    const {champId}=extra;
    const c=DB.lol.champions.find(x=>x.id===champId);
    if(c) c.skins=c.skins.filter(s=>s.id!==id);
  }
  else if(game==='lol-champ') {
    DB.lol.champions=DB.lol.champions.filter(c=>c.id!==id);
  }
  else if(game==='tft') { DB.tft.skins=DB.tft.skins.filter(s=>s.id!==id); }
  else if(game==='dbd-surv') { DB.dbd.survivors=DB.dbd.survivors.filter(c=>c.id!==id); }
  else if(game==='dbd-kill') { DB.dbd.killers=DB.dbd.killers.filter(c=>c.id!==id); }
  else if(game==='dbd-surv-skin') { const {cid}=extra; const c=DB.dbd.survivors.find(x=>x.id===cid); if(c) c.skins=c.skins.filter(s=>s.id!==id); }
  else if(game==='dbd-kill-skin') { const {cid}=extra; const c=DB.dbd.killers.find(x=>x.id===cid); if(c) c.skins=c.skins.filter(s=>s.id!==id); }
  else if(game==='valo-weapon') { DB.valo.weapons=DB.valo.weapons.filter(w=>w.id!==id); }
  else if(game==='valo-wskin') { const {wid}=extra; const w=DB.valo.weapons.find(x=>x.id===wid); if(w) w.skins=w.skins.filter(s=>s.id!==id); }
  else if(game==='valo-buddy') { DB.valo.buddies=DB.valo.buddies.filter(b=>b.id!==id); }
  saveData(DB); showToast('Supprimé ✓'); refresh();
}

// ═══════════════════════════════════════════════════════
//  HOME
// ═══════════════════════════════════════════════════════
function renderHome() {
  const db=loadData();
  const fnTotal = Object.values(db.fortnite.items||{}).reduce((a,arr)=>a+(arr?.length||0),0);
  const lolTotal = db.lol.champions.reduce((a,c)=>a+c.skins.length,0);
  const tftTotal = db.tft.skins.length;
  const dbdTotal = db.dbd.survivors.reduce((a,c)=>a+c.skins.length,0)+db.dbd.killers.reduce((a,c)=>a+c.skins.length,0);
  const valoTotal = db.valo.weapons.reduce((a,w)=>a+w.skins.length,0)+db.valo.buddies.length;
  const total = fnTotal+lolTotal+tftTotal+dbdTotal+valoTotal;
  return `
    <div class="page-header"><div><div class="page-title" style="color:var(--text)">MA COLLECTION</div><div style="color:var(--text-muted);font-size:.8rem;margin-top:4px;letter-spacing:.1em">SKINVAULT · BLOODY</div></div><button class="btn btn-primary" onclick="navigate('add')">➕ Ajouter</button></div>
    <div class="home-stats">
      <div class="stat-block"><div class="stat-number">${total}</div><div class="stat-label">Skins total</div></div>
      <div class="stat-block"><div class="stat-number">${db.lol.champions.length}</div><div class="stat-label">Champions LoL</div></div>
      <div class="stat-block"><div class="stat-number">${db.dbd.survivors.length+db.dbd.killers.length}</div><div class="stat-label">Persos DBD</div></div>
      <div class="stat-block"><div class="stat-number">${db.valo.weapons.length}</div><div class="stat-label">Armes Valo</div></div>
    </div>
    <div class="home-grid">
      ${[{k:'fortnite',c:'fn',n:'Fortnite',i:'⚡',cnt:fnTotal},{k:'lol',c:'lol',n:'League of Legends',i:'⚔️',cnt:lolTotal},{k:'tft',c:'tft',n:'TFT',i:'🎲',cnt:tftTotal},{k:'dbd',c:'dbd',n:'Dead by Daylight',i:'🔪',cnt:dbdTotal},{k:'valo',c:'valo',n:'Valorant',i:'🎯',cnt:valoTotal}].map(g=>`
        <div class="game-card ${g.c}" onclick="navigate('${g.k}')"><div class="game-card-icon">${g.i}</div><div class="game-card-name">${g.n}</div><div class="game-card-count">${g.cnt} skin${g.cnt!==1?'s':''}</div></div>
      `).join('')}
      <div class="game-card rand" onclick="navigate('random')"><div class="game-card-icon">🎲</div><div class="game-card-name">Randomizer</div><div class="game-card-count">Choix aléatoire</div></div>
    </div>`;
}

// ═══════════════════════════════════════════════════════
//  FORTNITE
// ═══════════════════════════════════════════════════════
function renderFN() {
  const db=loadData();
  const items=db.fortnite.items||{};
  const total=Object.values(items).reduce((a,arr)=>a+(arr?.length||0),0);
  return `
    <div class="page-header fn-page"><div class="page-title fn-accent">FORTNITE</div><span class="count-badge">${total} items</span></div>
    <div class="tabs" id="fn-cat-tabs">
      ${Object.entries(FN_CATS).map(([k,v],i)=>`<button class="tab ${i===0?'active':''}" data-cat="${k}" onclick="fnSwitchCat(this,'${k}')">${v.icon} ${v.label}</button>`).join('')}
    </div>

function renderFnGrid(cat, items) {

function fnOpenModal(id) {
  const db=loadData();
  const s=(db.fortnite.items['skin']||[]).find(x=>x.id===id);
  if(!s) return;
  const variants=s.variants||[];

  const varHTML = variants.length===0
    ? `<p style="color:var(--text-muted);font-size:.82rem;margin-top:6px">Aucune variante enregistrée.</p>`
    : `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;margin-top:10px">
        ${variants.map(v=>`
          <div onclick="openLightbox('${esc(v.image||'')}','${esc(v.name)}')"
               style="background:var(--bg4);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;cursor:${v.image?'zoom-in':'default'};transition:.2s"
               onmouseover="this.style.borderColor='rgba(0,212,255,.4)';this.style.transform='translateY(-3px)'"
               onmouseout="this.style.borderColor='var(--border)';this.style.transform='none'">
            ${v.image
              ? `<img src="${esc(v.image)}" style="width:100%;aspect-ratio:3/4;object-fit:cover;display:block" loading="lazy" onerror="this.style.display='none'">`
              : `<div style="width:100%;aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;font-size:1.6rem;background:var(--bg5)">⚡</div>`}
            <div style="padding:4px 5px;font-size:.6rem;color:var(--text-dim);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(v.name)}</div>
          </div>`).join('')}
      </div>`;

  const rarityColor = {Mythic:'var(--mythic)',Legendary:'var(--legendary)',Epic:'var(--epic)',Rare:'var(--rare)',Uncommon:'var(--uncommon)',Common:'var(--common)'}[s.rarity]||'var(--text-muted)';

  openModal(s.name, `
    <div style="display:flex;flex-direction:column;gap:0">

      <!-- Image principale centrée -->
      <div style="width:100%;background:var(--bg3);border-radius:var(--rl);overflow:hidden;cursor:${s.image?'zoom-in':'default'};position:relative;margin-bottom:20px"
           onclick="openLightbox('${esc(s.image||'')}','${esc(s.name)}')">
        ${s.image
          ? `<img src="${esc(s.image)}" style="width:100%;max-height:380px;object-fit:contain;display:block" onerror="this.style.display='none'">`
          : `<div style="height:200px;display:flex;align-items:center;justify-content:center;font-size:4rem">⚡</div>`}
        ${s.image?`<div style="position:absolute;bottom:10px;right:10px;background:rgba(0,0,0,.6);border-radius:6px;padding:4px 8px;font-size:.65rem;color:var(--text-muted);backdrop-filter:blur(4px)">🔍 Cliquer pour agrandir</div>`:''}
      </div>

      <!-- Badges rareté / série -->
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px">
        ${s.rarity?`<span style="padding:5px 14px;border-radius:20px;font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:rgba(0,0,0,.3);color:${rarityColor};border:1px solid ${rarityColor}40">${esc(s.rarity)}</span>`:''}
        ${s.series?`<span style="padding:5px 14px;border-radius:20px;font-size:.72rem;font-weight:600;letter-spacing:.08em;background:rgba(255,255,255,.05);color:var(--text-dim);border:1px solid var(--border2)">🏷 ${esc(s.series)}</span>`:''}
      </div>

      <!-- Variantes -->
      ${variants.length>0?`
      <div style="font-size:.65rem;letter-spacing:.18em;text-transform:uppercase;color:var(--fn);font-weight:700;margin-bottom:2px">
        ✨ Variantes · ${variants.length}
        <span style="color:var(--text-muted);font-weight:400;letter-spacing:.05em;text-transform:none;font-size:.72rem;margin-left:6px">Clique pour agrandir</span>

    </div>
  `);
}


function fnEditItem(cat, id) {
  navigate('add');
  setTimeout(()=>{
    document.getElementById('add-game-select').value='fortnite';
    addGameChanged();
    setTimeout(()=>{
      const db=loadData();
      const s=(db.fortnite.items[cat]||[]).find(x=>x.id===id);
      if(!s) return;
      const catEl=document.getElementById('fn-cat');
      const nameEl=document.getElementById('fn-name');
      const rarEl=document.getElementById('fn-rarity');
      const serEl=document.getElementById('fn-series');
      const imgEl=document.getElementById('fn-img-url');
      const prev=document.getElementById('fn-img-preview');
      if(catEl) catEl.value=cat;
      if(nameEl) nameEl.value=s.name;
      if(rarEl) rarEl.value=s.rarity||'';
      if(serEl) serEl.value=s.series||'';
      if(imgEl) imgEl.value=s.image||'';
      if(prev&&s.image){prev.src=s.image;prev.classList.add('show');}
      const form=document.querySelector('#add-form-container form');
      if(form){form.dataset.editId=id; form.dataset.editCat=cat;}
      showToast('Item chargé pour modification');
    },120);
  },60);
}
function fnFilter() {
  const q=document.getElementById('fn-search')?.value.toLowerCase()||'';
  const r=document.querySelector('#fn-rarity-filter .filter-btn.active')?.dataset.rarity||'all';
  document.querySelectorAll('#fn-grid .skin-card').forEach(c=>{
    c.style.display=(!q||c.dataset.name.includes(q))&&(r==='all'||c.dataset.rarity===r)?'':'none';
  });
}
function fnRarFilter(btn,r){
  document.querySelectorAll('#fn-rarity-filter .filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const q=document.getElementById('fn-search')?.value.toLowerCase()||'';
  document.querySelectorAll('#fn-grid .skin-card').forEach(c=>{
    c.style.display=(!q||c.dataset.name.includes(q))&&(r==='all'||c.dataset.rarity===r)?'':'none';
  });
}

function randSwitchTab(tab){
  _randTab=tab;
  _lolRandStep=1; _lolSelRoles=[]; _lolSelChamps=[];
  document.querySelectorAll('.rand-tab').forEach(t=>t.classList.toggle('active',t.textContent.includes(tab==='fortnite'?'Fortnite':tab==='lol'?'LoL':tab==='tft'?'TFT':tab==='dbd'?'DBD':'Valorant')));
  renderRandTab(tab);
}

function renderRandTab(tab){
  const c=document.getElementById('rand-content');
  if(!c) return;
  if(tab==='fortnite') c.innerHTML=renderRandFN();
  else if(tab==='lol')  c.innerHTML=renderRandLoL();
  else if(tab==='tft')  c.innerHTML=renderRandTFT();
  else if(tab==='dbd')  c.innerHTML=renderRandDBD();
  else if(tab==='valo') c.innerHTML=renderRandValo();
}

// — Fortnite randomizer
function renderRandFN(){
  return `
    <div class="lol-rand-step">
      <div class="lol-rand-step-title"><div class="step-num">1</div>Choisir les catégories à randomizer</div>
      <div class="fn-cats-grid">
        ${Object.entries(FN_CATS).map(([k,v])=>`
          <label class="fn-cat-check">
            <input type="checkbox" value="${k}" checked>
            <div class="fn-cat-pill"><span class="cat-icon">${v.icon}</span>${v.label}</div>
          </label>`).join('')}
      </div>
    </div>
    <div style="display:flex;justify-content:center;margin:24px 0">
      <button class="rand-btn" onclick="doRandFN()">🎲 Randomizer !</button>
    </div>
    <div class="rand-results" id="fn-rand-results"></div>`;
}

function doRandFN(){
  const db=loadData();
  const items=db.fortnite.items||{};
  const checked=[...document.querySelectorAll('.fn-cat-check input:checked')].map(i=>i.value);
  if(!checked.length){showToast('Coche au moins une catégorie','error');return;}
  const btn=document.querySelector('.rand-btn'); btn.classList.add('spinning'); setTimeout(()=>btn.classList.remove('spinning'),600);
  const results=[];
  for(const cat of checked){
    const list=items[cat]||[];
    if(list.length) results.push({cat,item:rand(list)});
  }
  const c=document.getElementById('fn-rand-results');
  if(!results.length){c.innerHTML=`<div class="empty-state" style="grid-column:1/-1"><div class="icon">😅</div><p>Aucun item dans les catégories sélectionnées.<br>Ajoute des skins d'abord !</p></div>`;return;}
  c.innerHTML=results.map(({cat,item})=>{
    // Si c'est un skin et qu'il a des variantes, on en choisit une au hasard
    const hasVariants = cat==='skin' && item.variants && item.variants.length>0;
    const variant = hasVariants ? rand(item.variants) : null;

    const variantSection = hasVariants ? `
      <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border)">
        <div style="font-size:.62rem;letter-spacing:.15em;text-transform:uppercase;color:var(--fn);margin-bottom:8px;font-weight:600">✨ Variante suggérée</div>
        <div style="display:flex;align-items:center;gap:10px">
          ${variant.image
            ? `<img src="${esc(variant.image)}" style="width:70px;height:70px;object-fit:cover;border-radius:8px;border:1px solid var(--border2)" loading="lazy" onerror="this.style.display='none'">`
            : `<div style="width:70px;height:70px;border-radius:8px;background:var(--bg4);display:flex;align-items:center;justify-content:center;font-size:2rem">⚡</div>`}
          <div>
            <div style="font-size:.88rem;color:var(--text);font-weight:600">${esc(variant.name)}</div>
            <div style="font-size:.7rem;color:var(--text-muted);margin-top:2px">${item.variants.length} variante${item.variants.length>1?'s':''} au total</div>
          </div>
          ${variant.image?``:''}
        </div>
      </div>` : '';

    return `
    <div class="rand-result-card" data-rarity="${esc(item.rarity||'')}" onclick="openLightbox('${esc(item.image||'')}','${esc(item.name)}')" style="${item.image?'cursor:zoom-in':''}">
      ${item.image?`<img src="${esc(item.image)}" class="rand-result-img" loading="lazy" onerror="this.style.display='none'">`:`<div class="rand-result-img no-img-big">${FN_CATS[cat]?.icon||'🎮'}</div>`}
      <div class="rand-result-info">
        <div class="rand-result-cat">${FN_CATS[cat]?.label||cat}</div>
        <div class="rand-result-name">${esc(item.name)}</div>
        ${item.rarity?`<div class="rand-result-sub" style="color:var(--${item.rarity.toLowerCase()})">${esc(item.rarity)}</div>`:''}
        ${item.series?`<div class="rand-result-sub">${esc(item.series)}</div>`:''}
        ${variantSection}
      </div>
    </div>`;
  }).join('');
}

let _lolMode='full', _lolCoRoleFilter='all';

function lolSetMode(m){
  _lolMode=m;
  document.getElementById('lol-mode-full').classList.toggle('selected',m==='full');
  document.getElementById('lol-mode-co').classList.toggle('selected',m==='co');
  document.getElementById('lol-full-block').style.display=m==='full'?'':'none';
  document.getElementById('lol-co-block').style.display=m==='co'?'':'none';
}

function lolCoRole(role){
  _lolCoRoleFilter=role;
  document.querySelectorAll('[id^="co-"]').forEach(b=>b.classList.remove('selected'));
  document.getElementById(`co-${role}`)?.classList.add('selected');
}

function lolRandSelectRole(role){
  const idx=_lolSelRoles.indexOf(role);
  if(idx===-1){
    if(_lolSelRoles.length>=2){showToast('Max 2 rôles','error');return;}
    _lolSelRoles.push(role);
  } else { _lolSelRoles.splice(idx,1); }
  LOL_ROLES.forEach(r=>{document.getElementById(`lolrole-${r}`)?.classList.toggle('selected',_lolSelRoles.includes(r));});
  const hint=document.getElementById('lol-role-hint');
  if(_lolSelRoles.length===2){
    if(hint) hint.textContent='✓ 2 rôles — choisis tes champions ci-dessous';
    document.getElementById('lol-step-2').style.display='';
    renderLolChampPick();
  } else {
    if(hint) hint.textContent=`${_lolSelRoles.length}/2 rôles`;
    document.getElementById('lol-step-2').style.display='none';
  }
}

function renderLolChampPick(){
  const db=loadData();
  const label=document.getElementById('lol-step2-label');
  if(label) label.textContent=`(${_lolSelRoles.join(' & ')})`;
  const container=document.getElementById('lol-champ-pick'); if(!container) return;
  let html='';
  for(const role of _lolSelRoles){
    const champs=db.lol.champions.filter(c=>(c.roles||[]).includes(role));
    html+=`<div style="margin-bottom:18px"><div style="font-size:.72rem;letter-spacing:.15em;text-transform:uppercase;color:var(--lol);margin-bottom:10px;font-weight:600">${role} — choisis 2 champions</div>
      ${champs.length===0?`<p style="color:var(--text-muted);font-size:.83rem">Aucun champion avec ce rôle.</p>`:`
      <div class="lol-champ-select-grid">${champs.map(c=>`
        <div class="lol-champ-btn" data-role="${role}" data-id="${esc(c.id)}" onclick="lolPickChamp(this,'${role}','${esc(c.id)}')">
          ${c.image?`<img src="${esc(c.image)}" onerror="this.style.display='none'">`:`<div style="width:44px;height:44px;border-radius:50%;background:var(--bg4);margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:1.2rem">👤</div>`}
          ${esc(c.name)}</div>`).join('')}
      </div>`}</div>`;
  }
  container.innerHTML=html;
}

function lolPickChamp(btn,role,id){
  const already=_lolSelChamps.find(x=>x.id===id);
  if(already){_lolSelChamps=_lolSelChamps.filter(x=>x.id!==id);btn.classList.remove('selected');return;}
  if(_lolSelChamps.filter(x=>x.role===role).length>=2){showToast('Max 2 champs par rôle','error');return;}
  _lolSelChamps.push({role,id}); btn.classList.add('selected');
}

function doRandLoLFull(){
  if(_lolSelRoles.length<2){showToast('Choisis 2 rôles','error');return;}
  if(_lolSelChamps.length===0){showToast('Choisis des champions','error');return;}
  _showLolResults(_lolSelChamps);
}

function doRandLoLAuto(){
  // Tout auto : on pioche 2 rôles aléatoires parmi ceux qui ont des champions, puis 2 champs par rôle
  const db=loadData();
  if(!db.lol.champions.length){showToast('Aucun champion enregistré','error');return;}

  // Trouver les rôles qui ont au moins 1 champion
  const rolesDispos=LOL_ROLES.filter(r=>db.lol.champions.some(c=>(c.roles||[]).includes(r)));

  let roles;
  if(rolesDispos.length===0){
    // Pas de rôles assignés — on prend juste 4 champs au hasard toutes catégories
    const shuffled=[...db.lol.champions].sort(()=>Math.random()-.5).slice(0,4);
    const sel=shuffled.map(c=>({role:'Random',id:c.id}));
    _showLolResults(sel);
    return;
  } else if(rolesDispos.length===1){
    roles=[rolesDispos[0],rolesDispos[0]];
  } else {
    // Mélanger et prendre 2 rôles aléatoires
    roles=[...rolesDispos].sort(()=>Math.random()-.5).slice(0,2);
  }

  const sel=[];
  for(const role of roles){
    const pool=db.lol.champions.filter(c=>(c.roles||[]).includes(role));
    const picked=[...pool].sort(()=>Math.random()-.5).slice(0,2);
    picked.forEach(c=>sel.push({role,id:c.id}));
  }
  _showLolResults(sel);
}

function doRandLoLCO(){
  const db=loadData();
  const pool=_lolCoRoleFilter==='all'?db.lol.champions:db.lol.champions.filter(c=>(c.roles||[]).includes(_lolCoRoleFilter));
  if(!pool.length){showToast('Aucun champion','error');return;}
  const champ=rand(pool);
  const skin=champ.skins.length?rand(champ.skins):null;
  document.getElementById('lol-rand-results').innerHTML=_lolResultCard('',champ,skin);
  document.querySelector('.rand-btn').classList.add('spinning');
  setTimeout(()=>document.querySelector('.rand-btn')?.classList.remove('spinning'),600);
}

function _showLolResults(list){
  const db=loadData();
  document.querySelector('.rand-btn').classList.add('spinning');
  setTimeout(()=>document.querySelector('.rand-btn')?.classList.remove('spinning'),600);
  const results=list.map(({role,id})=>{
    const champ=db.lol.champions.find(c=>c.id===id); if(!champ) return null;
    const skin=champ.skins.length?rand(champ.skins):null;
    return {role,champ,skin};
  }).filter(Boolean);
  if(!results.length){document.getElementById('lol-rand-results').innerHTML=`<div class="empty-state"><div class="icon">😅</div><p>Aucun résultat.</p></div>`;return;}
  document.getElementById('lol-rand-results').innerHTML=results.map(({role,champ,skin})=>_lolResultCard(role,champ,skin)).join('');
}

function _lolResultCard(role,champ,skin){
  // Si le skin a des chromas, on en choisit un au hasard
  const hasChromas = skin && skin.chromas && skin.chromas.length > 0;
  const chroma = hasChromas ? rand(skin.chromas) : null;

  const chromaSection = hasChromas ? `
    <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">
      <div style="font-size:.62rem;letter-spacing:.15em;text-transform:uppercase;color:var(--lol);margin-bottom:10px;font-weight:600">🎨 Chroma suggéré</div>
      <div style="display:flex;align-items:center;gap:12px">
        <div style="width:48px;height:48px;border-radius:50%;flex-shrink:0;border:2px solid rgba(255,255,255,.3);box-shadow:0 0 12px rgba(0,0,0,.4);${chroma.color?`background:${esc(chroma.color)}`:chroma.image?`background:url(${esc(chroma.image)}) center/cover`:'background:#555'}"></div>
        <div>
          <div style="font-size:.9rem;color:var(--text);font-weight:600">${esc(chroma.name)}</div>
          <div style="font-size:.72rem;color:var(--text-muted);margin-top:2px">${skin.chromas.length} chroma${skin.chromas.length>1?'s':''} disponible${skin.chromas.length>1?'s':''}</div>
        </div>
      </div>
    </div>` : '';

  const zoomSrc = skin?.image || champ.image || null;
  return `<div class="rand-result-card" onclick="openLightbox('${esc(zoomSrc||'')}','${esc((skin?.name||champ.name))}')" style="${zoomSrc?'cursor:zoom-in':''}">
    ${skin?.image?`<img src="${esc(skin.image)}" class="rand-result-img" loading="lazy" onerror="this.style.display='none'">`:champ.image?`<img src="${esc(champ.image)}" class="rand-result-img" loading="lazy" onerror="this.style.display='none'">`:`<div class="rand-result-img no-img-big">⚔️</div>`}
    ${zoomSrc?``:''}
    <div class="rand-result-info">
      <div class="rand-result-cat">${role?esc(role):(champ.roles||[]).join(' · ')||'Champion'}</div>
      <div class="rand-result-name">${esc(champ.name)}</div>
      <div class="rand-result-sub">${skin?esc(skin.name):'Skin de base'}</div>
      ${chromaSection}
    </div>
  </div>`;
}

let _dbdRandType='all';
function dbdRandFilter(btn,type){_dbdRandType=type;document.querySelectorAll('[data-dbd]').forEach(b=>b.classList.remove('active'));btn.classList.add('active');}
function doRandDBD(){
  const db=loadData();
  const btn=document.querySelector('.rand-btn'); btn.classList.add('spinning'); setTimeout(()=>btn.classList.remove('spinning'),600);
  let pool=[];
  if(_dbdRandType!=='killer') db.dbd.survivors.forEach(c=>c.skins.forEach(s=>pool.push({char:c,skin:s,type:'Survivant'})));
  if(_dbdRandType!=='survivor') db.dbd.killers.forEach(c=>c.skins.forEach(s=>pool.push({char:c,skin:s,type:'Tueur'})));

  const item=rand(pool);
  document.getElementById('dbd-rand-results').innerHTML=`
    <div class="rand-result-card" onclick="openLightbox('${esc(item.skin.image||'')}','${esc(item.skin.name)}')" style="${item.skin.image?'cursor:zoom-in':''}">
      ${item.skin.image?`<img src="${esc(item.skin.image)}" class="rand-result-img" loading="lazy">`:`<div class="rand-result-img no-img-big">🔪</div>`}
      <div class="rand-result-info">
        <div class="rand-result-cat">${item.type} · ${esc(item.char.name)}</div>
        <div class="rand-result-name">${esc(item.skin.name)}</div>
      </div>
    </div>`;
}

let _valoRandMode2='all';
function valoRandMode(m){
  _valoRandMode2=m;
  ['all','one','buddy'].forEach(x=>document.getElementById(`valo-mode-${x}`)?.classList.toggle('selected',x===m));
}
function doRandValo(){
  const db=loadData();
  document.querySelector('.rand-btn').classList.add('spinning');
  setTimeout(()=>document.querySelector('.rand-btn')?.classList.remove('spinning'),600);
  const c=document.getElementById('valo-rand-results');

  if(_valoRandMode2==='all'){
    // Un skin aléatoire pour CHAQUE arme qui a des skins
    const results=db.valo.weapons.filter(w=>w.skins.length>0).map(w=>({weapon:w,skin:rand(w.skins)}));
    if(!results.length){showToast('Aucun skin Valorant','error');return;}
    c.innerHTML=results.map(({weapon,skin})=>`
      <div class="rand-result-card">
        ${skin.image?`<img src="${esc(skin.image)}" class="rand-result-img landscape" loading="lazy" onerror="this.style.display='none'">`:`<div class="rand-result-img no-img-big">🔫</div>`}
        <div class="rand-result-info">
          <div class="rand-result-cat">${esc(weapon.name)}</div>
          <div class="rand-result-name">${esc(skin.name)}</div>
        </div>
      </div>`).join('');
  }
  else if(_valoRandMode2==='one'){
    const pool=[];
    db.valo.weapons.forEach(w=>w.skins.forEach(s=>pool.push({weapon:w,skin:s})));
    if(!pool.length){showToast('Aucun skin Valorant','error');return;}
    const {weapon,skin}=rand(pool);
    c.innerHTML=`<div class="rand-result-card">
      ${skin.image?`<img src="${esc(skin.image)}" class="rand-result-img landscape" loading="lazy">`:`<div class="rand-result-img no-img-big">🔫</div>`}
      <div class="rand-result-info"><div class="rand-result-cat">${esc(weapon.name)}</div><div class="rand-result-name">${esc(skin.name)}</div></div>
    </div>`;
  }
  else {

function _populateFNSkinSelect(){
  const db=loadData();
  const sel=document.getElementById('fn-var-parent'); if(!sel) return;
  const skins=db.fortnite.items['skin']||[];
  sel.innerHTML='<option value="">-- Choisir un skin --</option>'+skins.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('');
}
function saveFNVariant(){
  const parentId=document.getElementById('fn-var-parent')?.value;
  const name=document.getElementById('fn-var-name')?.value.trim();
  const image=document.getElementById('fn-var-img')?.value.trim();
  if(!parentId||!name){showToast('Choisis un skin et donne un nom','error');return;}
  const db=loadData();
  const skin=(db.fortnite.items['skin']||[]).find(s=>s.id===parentId);
  if(!skin){showToast('Skin introuvable','error');return;}
  if(!skin.variants) skin.variants=[];
  skin.variants.push({id:generateId('fnv'),name,image:image||null});
  saveData(db); showToast('Variante ajoutée ✓');
  document.getElementById('fn-var-name').value='';
  document.getElementById('fn-var-img').value='';
  document.getElementById('fn-var-preview').classList.remove('show');
}
function addFNSeries(){
  const val=document.getElementById('fn-new-series')?.value.trim(); if(!val) return;
  const db=loadData();
  if(!db.fortnite.series.includes(val)){db.fortnite.series.push(val);saveData(db);}
  const sel=document.getElementById('fn-series');
  const opt=document.createElement('option'); opt.value=val; opt.textContent=val; sel.appendChild(opt); sel.value=val;
  document.getElementById('fn-new-series').value='';
  showToast('Série ajoutée ✓');
}
function saveFNItem(e){
  e.preventDefault();
  const cat=document.getElementById('fn-cat').value;
  const name=document.getElementById('fn-name').value.trim();
  const rarity=document.getElementById('fn-rarity').value;
  const series=document.getElementById('fn-series').value;
  const image=document.getElementById('fn-img-url').value.trim();
  if(!name) return;
  const db=loadData();
  const form=e.target;
  const editId=form.dataset.editId;
  const editCat=form.dataset.editCat;
  if(editId&&editCat){
    // Mode édition
    const list=db.fortnite.items[editCat]||[];
    const idx=list.findIndex(x=>x.id===editId);
    if(idx!==-1){
      const old=list[idx];
      list[idx]={...old,name,rarity,series:series||null,image:image||old.image};
      // Si changement de catégorie
      if(editCat!==cat){
        list.splice(idx,1);
        if(!db.fortnite.items[cat]) db.fortnite.items[cat]=[];
        db.fortnite.items[cat].push({...old,name,rarity,series:series||null,image:image||old.image});
      }
    }
    saveData(db); showToast('Item modifié ✓'); addGameChanged();
  } else {
    if(!db.fortnite.items[cat]) db.fortnite.items[cat]=[];
    db.fortnite.items[cat].push({id:generateId('fn'),name,rarity,series:series||null,image:image||null,variants:[]});
    saveData(db); showToast('Item Fortnite ajouté ✓'); addGameChanged();
  }
}

          </div>
        </div>
        <div class="btn-row"><button type="submit" class="btn btn-primary">💾 Enregistrer</button><button type="button" class="btn btn-ghost" onclick="addGameChanged()">✕</button></div>
      </form>
    </div>
    <div class="form-section" id="valo-form-wskin" style="display:none">
      <div class="form-section-title">🎯 Ajouter un Skin d'Arme</div>
      <form onsubmit="saveValoWSkin(event)">
        <div class="form-row">
          <div class="form-group"><label>Arme *</label><select id="valo-wskin-weap" required><option value="">-- Arme --</option>${weapOpts}</select></div>
          <div class="form-group"><label>Nom du skin *</label><input type="text" id="valo-wskin-name" placeholder="ex: Prime Phantom" required></div>
        </div>
        <div class="form-row single">
          <div class="form-group"><label>URL image</label>
            <div class="img-url-wrap">
              <input type="url" id="valo-wskin-img" placeholder="https://..." oninput="previewUrl('valo-wskin-img','valo-wskin-preview')">
              <img id="valo-wskin-preview" class="img-url-preview" alt="Aperçu">
            </div>
          </div>
        </div>
        <div class="btn-row"><button type="submit" class="btn btn-primary">💾 Enregistrer</button></div>
      </form>
    </div>
    <div class="form-section" id="valo-form-buddy" style="display:none">
      <div class="form-section-title">🎯 Ajouter un Buddy</div>
      <form onsubmit="saveValoBuddy(event)">
        <div class="form-row">
          <div class="form-group"><label>Nom *</label><input type="text" id="valo-buddy-name" placeholder="ex: Radianite Bobby" required></div>
          <div class="form-group"><label>URL image</label>
            <div class="img-url-wrap">
              <input type="url" id="valo-buddy-img" placeholder="https://..." oninput="previewUrl('valo-buddy-img','valo-buddy-preview')">
              <img id="valo-buddy-preview" class="img-url-preview" alt="Aperçu">
            </div>
          </div>
        </div>
        <div class="btn-row"><button type="submit" class="btn btn-primary">💾 Enregistrer</button><button type="button" class="btn btn-ghost" onclick="addGameChanged()">✕</button></div>
      </form>
    </div>`;
}
function valoAddTab(tab){
  ['weap','wskin','buddy'].forEach(t=>{
    document.getElementById(`valo-tab-${t}`)?.classList.toggle('active',t===tab);
    document.getElementById(`valo-form-${t}`)?.style.setProperty('display',t===tab?'':'none');
  });
}
function saveValoWeap(e){
  e.preventDefault();
  const name=document.getElementById('valo-weap-name').value.trim(); if(!name) return;
  const image=document.getElementById('valo-weap-img').value.trim();
  const db=loadData();
  db.valo.weapons.push({id:generateId('valow'),name,image:image||null,skins:[]});
  saveData(db); showToast('Arme ajoutée ✓'); addGameChanged();
}
function saveValoWSkin(e){
  e.preventDefault();
  const wid=document.getElementById('valo-wskin-weap').value;
  const name=document.getElementById('valo-wskin-name').value.trim();
  const image=document.getElementById('valo-wskin-img').value.trim();
  if(!wid||!name) return;
  const db=loadData();
  const w=db.valo.weapons.find(x=>x.id===wid); if(!w) return;
  w.skins.push({id:generateId('valoski'),name,image:image||null});
  saveData(db); showToast('Skin Valorant ajouté ✓'); addGameChanged();
}
function saveValoBuddy(e){
  e.preventDefault();
  const name=document.getElementById('valo-buddy-name').value.trim(); if(!name) return;
  const image=document.getElementById('valo-buddy-img').value.trim();
  const db=loadData();
  db.valo.buddies.push({id:generateId('valob'),name,image:image||null});
  saveData(db); showToast('Buddy ajouté ✓'); addGameChanged();
}

// ═══ INIT ═══
window.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeLightbox();}});
navigate('home');
</script>
